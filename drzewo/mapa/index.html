<style>html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }

}

html, body { height: 100%; }

}

main { min-height: 0; position: relative; }

#p-toggle { display: none; grid-column: 2; grid-row: 1 / span 2; align-self: center; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--stamp); background: var(--leaf); color: var(--stamp); cursor: pointer; font-weight: 500; }

@media (max-width: 899px) {
  .panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; border-left: 0; border-top: 1px solid var(--rule-strong); border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.18); max-height: 76px; transition: max-height .25s ease; }

}
.word { display: inline-block; font-size: 0.85rem; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.6; }

details { border-top: 1px solid var(--rule); padding-top: 4px; }

/* pages: stories, documents */

}
.cast details { border: 0; padding: 0; margin-top: 4px; }
.cast summary { font-size: 0.95rem; min-height: 40px; }
.cast a:hover { border-color: var(--stamp); }
.cast .rl { grid-column: 2 / span 2; font-size: 0.82rem; color: var(--stamp); line-height: 1.25; }
.cast .yr { color: var(--ink-soft); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

 ""}], "a": 14, "nw": true}, "maria-porebska-1921": {"g": "Maria", "s": "Porębska", "x": "F", "y": "1921-2012", "by": 1921, "st": "confirmed", "m": "Rychlewicz", "f": [["Urodzona", "19 III 1921, Podegrodzie nr 127, ochrzczona 20 III (akt 7)", "confirmed"], ["Ślub", "11 VI 1945, Lubeka", "confirmed"], ["1940", "w marcu wywieziona z Nowego Sącza na roboty do Niemiec, do Warnitz pod Schwerinem", "family"], ["1940-1945", "robotnica rolna w Warnitz: u gospodarza Ottona Bokolta, potem u Fritza Thiessena, ostatni rok u Ulricha Steinhoffa", "family"], ["1944", "przed porodem zamieniła się miejscami z inną Polką i urodziła córkę w gospodarstwie Thiessenów w Warnitz", "likely"], ["1945", "w Zielone Świątki (20 V) Polacy z Warnitz pożegnali się z gospodarzami i odjechali ciężarówką, mówiąc, że jadą do domu", "likely"], ["1945", "w październiku wróciła z mężem i córką do Polski; w Szczecinie zabrano jej książeczkę robotniczą, dostała tylko przepustkę", "family"], ["2000", "świadek z Warnitz potwierdził jej pracę; Fundacja Polsko-Niemieckie Pojednanie przyznała jej odszkodowanie", "confirmed"], ["Zmarła", "7 I 2012, pochowana w Śremie", "confirmed"], ["1989", "odznaczona w Śremie Medalem Matki, jako Maria Rychlewicz (Głos Śremski 1989 nr 6)", "possible"]], "note": "Urodziła się w Podegrodziu, w domu nr 127, i następnego dnia została ochrzczona. W 1940 roku wywieziono ją na roboty do Warnitz pod Schwerinem, gdzie pracowała u miejscowych gospodarzy.", "how": ["Córka Stanisława Porębskiego i Ludwiki z Nowińskich (Podegrodzie 1921, akt 7).", "Data i miejsce urodzenia zgadzają się z aktem ślubu z Lubeki.", "Nie było jej w transportach z Nowego Sącza w listopadzie 1939 roku.", "Od wiosny 1940 roku urzędy pracy w Generalnym Gubernatorstwie wzywały całe roczniki na roboty rolne w Niemczech; w Krakowie roczniki 1919-1921 wezwano 25 VI 1940.", "Gospodarzy wymienia ona sama w oświadczeniu z 1999 roku (Bokolt Otto, Tisena, Steinhof) i jej córka (Bokold, Thysen); świadek pisze Bokold i Thießen.", "Książka adresowa Schwerinu z 1938 roku potwierdza w Warnitz gospodarzy Fritza Thiessena (zagroda 1), Ulricha Steinhoffa (zagroda 9) i Paula Pornhagena (zagroda 8; u niego według świadka pracowała Zofia). Otto Bokolta tam nie ma; mógł przejąć gospodarstwo po 1938 roku.", "Spis gospodarstw z 1928 roku podaje zagrodę Fritza Thiessena: 48 ha, 5 koni, 25 sztuk bydła. Zagroda 9 należała wtedy do Friedricha Schoppenhauera, więc Steinhoff przejął ją między 1928 a 1938 rokiem. Bokolta nie ma także w tym spisie.", "Najpewniej wyjechała więc w latach 1940-1942 przez Arbeitsamt w Nowym Sączu.", "Według świadka (ur. 1933 w Warnitz) we wsi były trzy Polki: Zofia, Maria u Bokolda i Nina u Thiessenów. Przed porodem Maria i Nina zamieniły się miejscami, a niedługo potem wróciły do swoich gospodarstw.", "Marzec 1940 roku podaje córka; sama Maria daty wyjazdu nie podała, a świadek pamięta tylko, że Polki były we wsi co najmniej 2-3 lata.", "Córka pisze, że ślub był w lipcu 1945 roku; akt z Lubeki podaje 11 czerwca 1945 roku, więc obowiązuje data z aktu.", "Urząd miasta Schwerin odnalazł świadka i 26 IX 2000 przesłał jej zeznanie Marii, a kopię Międzynarodowej Służbie Poszukiwań w Arolsen. Stąd sprawa Marii w Arolsen Archives (T/D 1.823.182)."], "gr": [2], "src": [{"t": "Standesamt Lübeck I, Heiratsurkunde Nr. 831/1945 (odpis z 7 III 1946)", "c": "Arolsen Archives, 2.2.2 Various public administrations i companies, Part 552 Folder 0553, DocID 76853588", "u": "https://collections.arolsen-archives.org/en/search/person/76853588"}, {"t": "Dokumenty rodzinne Rychlewiczów: odpis skrócony aktu urodzenia (USC Śrem 312/1962), oświadczenie Marii Rychlewicz (1999), zeznanie świadka z Warnitz (Lemgo, 17 IX 2000) i pismo urzędu miasta Schwerin z 26 IX 2000", "c": "oryginały u rodziny", "u": ""}, {"t": "Adreßbuch der Landeshauptstadt Schwerin, 95. Jahrgang 1938, s. 296-297 (Warnitz)", "c": "DigiBib CompGen", "u": "https://www.digibib.genealogy.net/viewer/image/873488490D_1938/750/LOG_0058/"}, egrodzia, który zmarł, gdy miała 5 miesięcy. Dlatego w 1919 roku na jej ślub jako niepełnoletniej zgodził się sąd opiekuńczy w Starym Sączu.", "how": ["Rodzice: Antoni Nowiński, kościelny, i Marianna z Janorów.", "Brat Jan zmarł w 1903 roku w wieku 15 lat.", "Brat Ignacy był w czasie I wojny w niewoli rosyjskiej, wrócił w wymianie jeńców i ożenił się tuż potem, w styczniu 1919 roku."], "src": [{"t": "Parafia Podegrodzie, małżeństwa 1919 akt 18 (Porębski × Nowińska)", "c": "Skanoteka PTG, zespół 6396, jednostka 4510, plik 111", "u": "https://skanoteka.genealodzy.pl/index.php?op=pg&id=4266&sy=4510&kt=1&plik=111.jpg"}, {"t": "Parafia Podegrodzie, urodzenia 1921 akt 7 (Maria Porębska) i 1924 akt 16 (Karolina Porębska)", "c": "Skanoteka PTG, zespół 6396 (księgi parafii Podegrodzie, zdjęcia FamilySearch), jednostka 3535, pliki 189 i 193", "u": "https://skanoteka.genealodzy.pl/index.php?op=pg&id=4266&sy=3535&kt=1&plik=189.jpg"}, {"t": "Parafia Podegrodzie: Gostwica urodzenia 1835 (Józef Porębski) i 1891 akty 3-4 (Stanisław i Paweł); Podegrodzie urodzenia 1852 akt 27 (Antoni Nowiński) i 1896 akt 5 (Ludwika); Gostwica małżeństwa 1873 akt 3; Podegrodzie zgony 1896 akt 8 i 1903 akt 13; małżeństwa 1919 akt 3", "c": "Skanoteka PTG, zespół 6396 (id4266): jednostki 3540 (plik 89), 3545 (plik 136), 3535 (pliki 19, 144), 4515 (plik 57), 5505 (pliki 44, 51), 4510 (plik 110)", "u": "https://skanoteka.genealodzy.pl/id4266"}, {"t": "relacja babć Elżbiety i Loni przez mamę Huberta, 11 X 2026", "c": "", "u": ""}], "a": 31}, "jozef-porebski": {"g": "Józef", "s": "Porębski", "x": "M", "y": "1835-?", "by": 1835, "st": "confirmed", "f": [["Urodzony", "2 II 1835, Gostwica nr 58", "confirmed"], ["Zawód", "zagrodnik (hortulanus) w Gostwicy nr 53", "confirmed"], ["2. ślub", "26 VI 1873, Gostwica (akt 3), z Anną Piętką", "confirmed"]], "note": "Syn Andrzeja Porębskiego i Teresy ze Skoczeniów. Żył jeszcze w marcu 1911 roku; kiedy zmarł, nie wiemy.", "how": ["W 1873 roku był wdowcem po Annie z Kuzaków(?).", "Żył w 1891 roku.", "Żył jeszcze w marcu 1911 (akt zgonu żony).", "W dotychczasowym przeglądzie zgonów Gostwicy z lat 1911-1932 nie odnaleziono jego wpisu; data zgonu pozostaje nieznana."], "src": [{"t": "Parafia Podegrodzie: Gostwica urodzenia 1835 (Józef Porębski) i 1891 akty 3-4 (Stanisław i Paweł); Podegrodzie urodzenia 1852 akt 27 (Antoni Nowiński) i 1896 akt 5 (Ludwika); Gostwica małżeństwa 1873 akt 3; Podegrodzie zgony 1896 akt 8 i 1903 akt 13; małżeństwa 1919 akt 3", "c": "Skanoteka PTG, zespół 6396 (id4266): jednostki 3540 (plik 89), 3545 (plik 136), 3535 (pliki 19, 144), 4515 (plik 57), 5505 (pliki 44, 51), 4510 (plik 110)", "u": "https://skanoteka.genealodzy.pl/id4266"}, {"t": "Parafia Brzeźnio, akta stanu cywilnego: urodzenia 1914 akt 171 (Stefan Stencel), 1919 akt 188 (Helena Stencel), 1921 akt 231 (Stanisław Stencel); indeksy urodzeń 1914, 1918-1923 i zgonów 1917-1930", "c": "Archiwum Państwowe w Łodzi; metryki.genealodzy.pl, id218", "u": "https://metryki.genealodzy.pl/"}], "a": 60}, "anna-pietka": {"g": "Anna", "s": "Piętka", "x": "F", "y": "1856-1911", "by": 1856, "st": "confirmed", "m": "Porębska", "f": [["Urodzona", "15 VII 1856, Gostwica nr 75, chrzest tego samego dnia", "confirmed"], ["Ślub", "26 VI 1873, Gostwica (akt 3), mając 17 lat", "confirmed"], ["Zmarła", "25 III 1911, Gostwica nr 53, w wieku 54 lat, na zapalenie płuc (akt 11)", "confirmed"]], "note": "Wyszła za mąż przed siedemnastymi urodzinami; ojciec osobiście wyraził zgodę i podpisał się krzyżykiem.", "how": ["Rodzice: Andrzej Piętka i Kunegunda z Dadałów lub Dadolów (odczyt niepewny), zagrodnicy.", "Duplikat Gostwicy, urodzenia 1856, akt 10, s. 134 (plik 074): urodzona i ochrzczona 15 VII 1856, dom nr 75. Rodzice Andrzej Piętka i Kunegunda; jej nazwisko rodowe zapisane jako Dadol/Dorol (odczyt niepewny).", "W ślubie 26 VI 1873 podano wiek 17 lat; z daty urodzenia wynika niespełna 17. Zgon 25 III 1911 w wieku 54 lat jest zgodny z chrztem."], "src": [{"t": "Parafia Podegrodzie  i 1903 akt 13; małżeństwa 1919 akt 3", "c": "Skanoteka PTG, zespół 6396 (id4266): jednostki 3540 (plik 89), 3545 (plik 136), 3535 (pliki 19, 144), 4515 (plik 57), 5505 (pliki 44, 51), 4510 (plik 110)", "u": "https://skanoteka.genealodzy.pl/id4266"}], "a": 62}, "maria-janor": {"g": "Marianna", "s": "Janor", "x": "F", "y": "zmarła", "st": "confirmed", "m": "Nowińska", "note": "Żona kościelnego Antoniego Nowińskiego, owdowiała w 1896 roku. W 1919 roku prawdopodobnie jeszcze żyła.", "how": ["Rodzice: Franciszek Janor (także Janur) i Anna z Wójsów, tak w aktach urodzeń dzieci 1887-1894.", "Ślubu z Antonim nie odnaleziono w księdze wsi Podegrodzie z lat 1873-1890 ani w duplikatach dla całej parafii z lat 1875-1889. Najwcześniejsze odnalezione dziecko urodziło się w 1887 roku; data i parafia ślubu pozostają nieznane."], "src": [{"t": "Parafia Podegrodzie: Gostwica urodzenia 1835 (Józef Porębski) i 1891 akty 3-4 (Stanisław i Paweł); Podegrodzie urodzenia 1852 akt 27 (Antoni Nowiński) i 1896 akt 5 (Ludwika); Gostwica małżeństwa 1873 akt 3; Podegrodzie zgony 1896 akt 8 i 1903 akt 13; małżeństwa 1919 akt 3", "c": "Skanoteka PTG, zespół 6396 (id4266): jednostki 3540 (plik 89), 3545 (plik 136), 3535 (pliki 19, 144), 4515 (plik 57), 5505 (pliki 44, 51), 4510 (plik 110)", "u": "https://skanoteka.genealodzy.pl/id4266"}], "a": 63}, "stanislaw-kubiak": {"g": "Stanisław", "s": "Kubiak", "x": "M", "y": "zm. przed 1912", "st": "possible", "note": "Możliwy ojciec Katarzyny; jako rodziców podali go sąsiedzi w jej akcie zgonu.", "how": ["Wymieniony w akcie zgonu córki: Borków 1912, akt 27.", "Rodziców podali sąsiedzi z Czartek, a nie rodzina.", "Pary Stanisław Kubiak i Katarzyna z Lisów nie ma w Rychnowie w latach 1819-1832.", "Pasuje też inny chrzest: Katarzyna, ur. II 1827 w Rychnowie, córka Antoniego Kubiaka i Maryanny Janas (1827, akt 3).", "Rozstrzygnie to ślub Stanisława Kaźmierczaka z Katarzyną Kubiak (Rychnów 1833-1844 lub Blizanów, jeszcze nieprzeczytane)."], "src": [{"t": "Parafia Borków, zgony 1912, akt 27 (Katarzyna Kazimierczak z d. Kubiak)", "c": "Archiwum Państwowe w Kaliszu, 11/657/0/1/91 (jednostka 11946021), skan 67; indeks skan 72", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11946021"}], "a": 82}, "katarzyna-lis": {"g": "Katarzyna", "s": "Lis", "x": "F", "y": "zm. przed 1912", "st": "possible", "m": "Kubiak", "note": "Możliwa matka Katarzyny; jako rodziców podali ją sąsiedzi w jej akcie zgonu.", "how": ["Wymieniona w akcie zgonu córki (Borków 1912, akt 27).", "Możliwe, że to Katarzyna z Lisów, lat 22, żona Józefa Popiołka, wymieniona w Rychnowie w 1829 roku (niepotwierdzone).", "Rodziców podali sąsiedzi z Czartek, a nie rodzina.", "Pary Stanisław Kubiak i Katarzyna z Lisów nie ma w Rychnowie w latach 1819-1832.", "Pasuje też inny chrzest: Katarzyna, ur. II 1827 w Rychnowie, córka Antoniego Kubiaka i Maryanny Janas (1827, akt 3).", "Rozstrzygnie to ślub Stanisława Kaźmierczaka z Katarzyną Kubiak (Rychnów 1833-1844 lub Blizanów, jeszcze nieprzeczytane)."], "src": [{"t": "Parafia Borków, zgony 1912, akt 27 (Katarzyna Kazimierczak z d. Kubiak)", "c": "Archiwum Państwowe w Kaliszu, 11/657/0/1/91 (jednostka 11946021), skan 67; indeks skan 72", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11946021"}], "a": 83}, "teodor-klaczyk-1876": {"g": "Teodor", "s": "Klaczyk", "x": "M", "y": "1876-przed 1925", "by": 1876, "st": "likely", "f": [["Urodzony", "26 X 1876, Zbrudzewo koło Nochowa", "confirmed"], ["1. ślub", "10 V 1899, Śrem (USC Śrem 39/1899), z Franciszką Nowaczyk (zm. 1913)", "confirmed"], ["2. ślub", "29 VII 1913, Zaniemyśl (USC Zaniemyśl 27/1913), z Franciszką Zydorczak; był wdowcem, mieszkał w Mechlinie", "confirmed"], ["1913", "robotnik w Mechlinie", "confirmed"]], "note": "Robotnik z Mechlina, syn chałupnika ze Zbrudzewa. Owdowiał w styczniu 1913 roku i jeszcze w tym samym roku ożenił się z Franciszką Zydorczak. Prawdopodobnie ojciec Władysławy (ur. 1919). Zmarł przed drugim ślubem Franciszki, z Tadeuszem Szylderowiczem; kiedy i na co, nie wiemy.", "how": ["Rodzice: zmarły Józef Kłaczyk, chałupnik, i Wiktoria ze Szczepaniaków ze Zbrudzewa.", "Ślub z Franciszką: akt USC Zaniemyśl 27/1913, odczytany.", "Pracował prawdopodobnie w majątku Skrzydlewskich w Mechlinie; Zbrudzewo też do nich należało (1867-1911).", "Akt zgonu nieodnaleziony: księgi Śremu po 1913 roku nie są w sieci.", "Brak go w pruskich listach strat 1914-1919 (przejrzane wszystkie wpisy dla Zbrudzewa, Mechlina i Nochowa), w liście strat Wojska Polskiego 1918-1920 i w bazie powstańców wielkopolskich; raczej nie zginął jako żołnierz.", "Dzieci z pierwszego małżeństwa: w USC Śrem 1899-1913 nie zapisano żadnych (indeksy BaSIA i Geneteka)."], "src": [{"t": "USC Śrem, małżeństwa 1899 Nr. 39 (Kłaczyk × Nowaczyk) i zgony 1913 Nr. 18 (Franciszka Klaczyk z d. Nowaczyk)", "c": "Archiwum Państwowe w Poznaniu, fonds 53/1963: jednostka 1414141 skany 80-81; jednostka 2783926 skan 21", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/1414141"}, {"t": "BaSIA (indeks): USC Zaniemyśl 1893 urodzenia (Franziska Zydorczak, z dopiskiem o zgonie 1977) i 1913 małżeństwa (Klaczyk × Zydorczak); USC Książ 1892 Nr. 44 (Zydorczak × Barańska); parafia Zaniemyśl 1859 nr 15, parafia Wieszczyczyn 1863 nr 6, parafia Śrem 1862 nr 44", "c": "AP Poznań 53/1987/0/1/58 skan 80; 53/1987/0/3/199 skan 102; 53/1879/0/3/59 skan 90 (skanów nie odczytano)", "u": "https://www.basia.famula.pl/"}, {"t": "Relacja babci Elżbiety Dworczyńskiej z d. Kazimierczak", "c": "10 X 2026", "u": ""}, {"t": "USC Zaniemyśl, Heirats-Register 1913, Nr. 27 (Klaczyk × Zydorczak)", "c": "Archiwum Państwowe w Poznaniu, 53/1987/0/2/199, skan 102", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/2812764"}], "a": 18, "nw": true}, "franciszka-zydorczak-1893": {"g": "Franciszka", "s": "Zydorczak", "x": "F", "y": "1893-1977", "by": 1893, "st": "confirmed", "m": "Szylderowicz", "f": [["Urodzona", "9 IX 1893, Kępa Mała (USC Zaniemyśl 155/1 encel), 1921 akt 231 (Stanisław Stencel); indeksy urodzeń 1914, 1918-1923 i zgonów 1917-1930", "c": "Archiwum Państwowe w Łodzi; metryki.genealodzy.pl, id218", "u": "https://metryki.genealodzy.pl/"}, {"t": "Podegrodzie, zgony 1895, akt 22: Zofii Nowińskiej", "c": "Skanoteka PTG, parafia Podegrodzie, jednostka 5505, plik 043", "u": "https://skanoteka.genealodzy.pl/index.php?op=pg&id=4266&sy=5505&kt=1&plik=043.jpg"}], "nw": true}, "leon-dworczynski-2022": {"g": "Leon", "s": "Dworczyński", "x": "M", "y": "ur. 2022", "by": 2022, "st": "living", "lv": true}, "kunegunda-porebska-1875": {"g": "Kunegunda", "s": "Porębska", "x": "F", "y": "1875-1875", "by": 1875, "st": "confirmed", "f": [["Urodzona", "9 VII 1875, Gostwica nr 53", "confirmed"], ["Zmarła", "21 VII 1875, pogrzeb 23 VII (akt 20)", "confirmed"]], "note": "Starsza siostra Stanisława i Pawła. Zmarła jako niemowlę.", "how": ["Gostwica, urodzenia 1875, akt 19, s. 145, plik 089: urodzona 9 VII, ochrzczona 11 VII 1875, dom nr 53. Wcześniejsze odczyty (kwiecień, potem czerwiec) były błędne.", "Miesiąc wynika z kolejności wpisów: w księdze chrztów poprzedni akt 18 stoi pod nagłówkiem „Julius” (ur. 30 VI, chrzest 4 VII); w księdze zgonów akt 19 z 3-5 VII poprzedza akt 20.", "Rodzice: Józef Porębski, syn Andrzeja i Teresy Skoczeń, oraz Anna Piętka, córka Andrzeja i Kunegundy Dadol. Te same pary dziadków co w akcie bliźniąt z 1891 roku.", "Osobny akt zgonu 20/1875, s. 159, plik 090: zgon 21 VII, pogrzeb 23 VII, wiek dwa tygodnie, dom nr 53. Rodzice Józef Porębski i Anna z Piętków; przyczyna: wrodzona słabość (debilitas congenita). Dopisek przy chrzcie: zmarła 21/7 1875."], "src": [{"t": "Gostwica, urodzenia 1875, akt 19: Kunegunda Porębska", "c": "Skanoteka PTG, parafia Podegrodzie, jednostka 3545, plik 089, s. 145", "u": "https://skanoteka.genealodzy.pl/index.php?op=pg&id=4266&sy=3545&kt=1&plik=089.jpg"}, {"t": "Gostwica, zgony 1875, akt 20: Kunegunda Porębska", "c": "Skanoteka PTG, parafia Podegrodzie, jednostka 5510, pli "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "antonina-gadzikowska-1916": {"g": "Antonina", "s": "Gadzikowska", "x": "F", "y": "1916-?", "by": 1916, "st": "family", "m": "Drzycimska", "f": [["Urodzona", "31 VII 1916", "family"]], "how": ["Na drzewie nad nazwiskiem „Gadzikowska” dopisano „Sobecka”; nie wiadomo, czy to nazwisko z pierwszego małżeństwa.", "Miejsce urodzenia poprawione na drzewie, odczyt „Małachin” niepewny.", "„Małachin” z drzewa to Malachin w gminie Czersk (pow. chojnicki); w 1916 roku urodzenia zapisywał USC Czersk. Księga urodzeń 1916 (AP Bydgoszcz 6/1619/0/2.1/434) nie ma skanów.", "Rodzice Jan i Domiana w latach 1909-1913 zgłaszali dzieci w USC Mokre (gm. Czersk), w 1907 w Czersku; jej akt z 1916 roku jest w Mokrem albo w Czersku, żaden nie jest dostępny online.", "Rodzeństwo z indeksów i aktów: m.in. Michał (1907-1986) i Jan Władysław (1922-2000)."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "jozef-krieger": {"g": "Józef", "s": "Krieger", "x": "M", "y": "zmarły", "st": "family", "f": [["Urodzony", "Szubin, 20 I (rok niedopisany)", "family"], ["Zmarł", "Szubin", "family"]], "how": ["Księgi USC Szubin z lat 1900-1915 nie mają skanów ani indeksów w sieci; rok urodzenia nieznany."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "kazimiera-janicka-1915": {"g": "Kazimiera", "s": "Janicka", "x": "F", "y": "1915-?", "by": 1915, "st": "family", "m": "Krieger", "f": [["Urodzona", "26 II 1915, Kcynia", "family"]], "how": ["Jej akt urodzenia powinien być w księdze USC Kcynia Miasto 1915 (AP Bydgoszcz 6/1702/0/3.1/159), która nie ma skanów."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "leon-klunder-1904": {"g": "Leon Józef", "s": "Klunder", "x": "M", "y": "1904-1992", "by": 1904, "st": "likely", "f": [["Urodzony", "24 X 1904, akt 65 USC Raciąż; miejsce Żalno według rodziny", "likely"], ["Zmarł", "24 IV 1992", "family"]], "note": "Urodził się w październiku 1904 roku w Żalnie koło Tucholi jako najmłodsze znane dziecko Józefa i Anny z Malzahnów.", "how": ["Indeks Pomorski PTG: USC Raciąż, urodzenia 1904, akt 65, „Leon Józef Klunder”, ojciec Józef, matka Anna z Malzahnów (w indeksie „Walzahn”). Drugi wpis w tym indeksie podaje datę 24 X.", "Na drzewie rodzinnym miesiąc był poprawiany (01 albo 10); indeks rozstrzyga na październik. Skanu aktu nie ma w sieci (AP Bydgoszcz 6/1769/0/168).", "Żalno leży w parafii i okręgu USC Raciąż; miejsce urodzenia znamy z drzewa rodzinnego.", "Ślubu Leona z Marianną Nagajską nie znaleziono: akta Grudziądza i Działdowa z lat 1919-1936 nie są w sieci.", "Miejsce śmierci przekreślone i nadpisane na drzewie, odczyt „Wałcz” niepewny."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "USC Raciąż, urodzenia 1904, akt 65: Leon Józef Klunder (indeks)", "c": "Indeks Pomorski PTG; Archiwum Państwowe w Bydgoszczy, 6/1769/0/168, obraz 57 (skanu nie widziano)", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}], "nw": true}, "marianna-nagajska-1910": {"g": "Marianna Ella", "s": "Nagajska", "x": "F", "y": "1910-1988", "by": 1910, "st": "confirmed", "m": "Klunder", "f": [["Urodzona", "26 VII 1910, o 20:00, Gdańsk, szpital miejski przy Sandgrube; akt 2964/1910", "confirmed"], ["Zmarła", "7 IX 1988, Szubin", "family"]], "note": "Urodziła się w szpitalu w Gdańsku; rodzice mieszkali wtedy w Sopocie.", "how": ["Akt urodzenia: USC Gdańsk 1910 nr 2964, zgłoszony 28 VII 1910 przez dyrekcję szpitali miejskich; matka Ella z domu Katschack (ewangeliczka), ojciec Bronislaus Nagajski, kierownik interesu (katolik), mieszkali w Sopocie, Südstraße 32 (nazwa ulicy odczytana prawdopodobnie).", "Akt nie ma dopisków na marginesie.", "Data śmierci z drzewa rodzinnego; akt zgonu jest w USC Szubin."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Gdańsk, urodzenia 1910, akt 2964: Marianna Ella Nagajska", "c": "Archiwum Państwowe w Gdańsku, USC Gdańsk 10/1609, sygn. 948 (urodzenia 14 VII - 12 VIII 1910), skan 94; indeks 1910 sygn. 969, s. 75", "u": "https://genbaza.pl/metryki/td6nrdp91e/ap-gdansk-10/gdansk-1609/0948-1910-ur/94"}], "nw": true}, "jan-szczepanski": {"g": "Jan", "s": "Szczepański", "x": "M", "y": "zmarły", "st": "family", "how": ["Możliwy trop: Johann Szczepański, robotnik, ur. 11 VI 1865 w Barcinie, syn Jakuba i Agnieszki z Walczaków, ślub w Łabiszynie 1891 (akt 12) z Władysławą Lewandowską. Nie potwierdzono, że to ojciec Stanisławy.", "Ta para z Łabiszyna mieszkała w Ojrzanowie (gm. Łabiszyn) i miała tam dziewięcioro dzieci w latach 1892-1907 (USC Łabiszyn Wieś II, akty przeczytane); troje zmarło lub wzięło ślub w Bydgoszczy. Po 1907 roku w Łabiszynie dzieci już nie rejestrowali. Że to rodzice Stanisławy, nadal tylko możliwe.", "Możliwy ślad przeprowadzki: Wiktoria Szczepańska, córka Jana i Władysławy z Lewandowskich, ochrzczona w Marzeninie koło Wrześni w 1910 roku (akt 87, indeks Geneteki; księga w Archiwum Archidiecezjalnym w Gnieźnie)."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Łabiszyn, małżeństwa 1891, akt 12: Jan Szczepański i Władysława Lewandowska", "c": "Archiwum Państwowe w Bydgoszczy, USC Łabiszyn Wieś II 6/1636/0/2.2/53, skany 25-26", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/21518238"}], "nw": true}, "nn-lewandowska-szczepanska": {"g": "Władysława", "s": "Lewandowska", "x": "F", "y": "zmarła", "st": "family", "m": "Szczepańska", "how": ["Imię z drzewa odczytane jako „...dysana”; ta sama ręka pisze W podobnie do N (jak w „Niktoria”), więc to najpewniej Władysława (odczyt prawdopodobny).", "Możliwy trop: ślub Jana Szczepańskiego (ur. 1865 Barcin) z Władysławą Lewandowską (ur. 1873), USC Łabiszyn Wieś II, 15 V 1891, akt 12 (skan przeczytany). W 1918 roku miałaby 44 lata; związku z Mogilnem jeszcze nie znaleziono."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Łabiszyn, małżeństwa 1891, akt 12: Jan Szczepański i Władysława Lewandowska", "c": "Archiwum Państwowe w Bydgoszczy, USC Łabiszyn Wieś II 6/1636/0/2.2/53, skany 25-26", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/21518238"}], "nw": true}, "wojciech-wieckowski": {"g": "Wojciech", "s": "Więckowski", "x": "M", "y": "zmarły", "st": "family", "how": ["Możliwy: Wojciech Więckowski (27) i Wiktoria Nowicka (22), ślub w Osielsku 1895 nr 20 (Poznan Project). Tylko indeks; nic nie łączy ich jeszcze z Franciszkiem."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "wiktoria-wieckowska": {"g": "Wiktoria", "s": "Więckowska", "x": "F", "y": "zmarła", "st": "family", "m": "Więckowska", "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "jan-gadzikowski": {"g": "Jan", "s": "Gadzikowski", "x": "M", "y": "1867-1941", "by": 1867, "st": "confirmed", "f": [["Urodzony", "21 albo 24 VI 1867, Bielawy koło Czerska", "likely"], ["Zawód", "robotnik (1907)", "confirmed"], ["Pierwszy ślub", "16 I 1892, USC Czersk akt 4, z Franciszką Ossowską", "likely"], ["Drugi ślub", "1903, USC Karsin akt 24, z Domianą Knitter", "likely"], ["Mieszkał", "Czersk (1907)", "confirmed"], ["Zmarł", "1941, Czersk, w wieku 73 lat", "likely"]], "note": "Robotnik z okolic Czerska. Z drugą żoną Domianą miał co najmniej dziesięcioro dzieci.", "how": ["Akt urodzenia syna Michała (USC Czersk 1907 nr 313, przeczytany): ojciec Jan Gadzikowski, robotnik z Czerska, żona Domiana z Knitterów.", "Prawdopodobnie ten sam Jan, który w 1892 ożenił się w Czersku z Franciszką Ossowską (akt 4, przeczytany): ur. w czerwcu 1867 w Bielawach, syn Wojciecha (Albrechta) Gadzikowskiego i Antoniny z Sumionów. Potwierdzi to akt ślubu z Karsina 1903 (powinien podać, że był wdowcem).", "Zgon: Jan Gadzikowski zm. 1941 w Czersku w wieku 73 lat 11 miesięcy (parafia Czersk 112/1941, USC Czersk Wieś 71/1941; indeks).", "Dzieci z Domianą według Indeksu Pomorskiego: Anastazja 1904, Marta 1905, Franciszka 1906 (zm. niemowlęciem), Michał 1907, Anna 1909, Marianna 1910, Antoni 1912, Paulina 1913, Jadwiga 1919, Jan Władysław 1922."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Czersk, urodzenia 1907, akt 313: Michał Gadzikowski", "c": "Archiwum Państwowe w Bydgoszczy, USC Czersk 6/1619/0/2.1/175, skan 314", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/21514671"}, {"t": "Czersk, małżeństwa 1892, akt 4: Jan Gadzikowski i Franciszka Ossowska", "c": "Archiwum Państwowe w Bydgoszczy, USC Czersk 6/1619/0/2.2/101, skany 9-10", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/21514616"}, {"t": "Czersk, zgony 1884, akt 46: Wojciech Gadzikowski", "c": "Archiwum Państwowe w Bydgoszczy, USC Czersk 6/1619/0/2.3/58, skan 48", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/21514593"}, {"t": "Czersk, zgony 1921, akt 112: Antonina Gadzikowska z domu Sumion", "c": "Archiwum Państwowe w Bydgoszczy, USC Czersk 6/1619/0/2.3/348, skan 113", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/21514906"}, {"t": "Gadzikowscy i Knitterowie: wpisy z Indeksu Pomorskiego (Karsin, Wiele, Brusy, Łąg, Mokre, Czersk)", "c": "PTG, Indeks Pomorski: USC Karsin ur. 1879/226, małż. 1903/24, zg. 1919/31; parafia Wiele chrzty 1879/286; parafia Brusy śluby 1872/84; dzieci Jana i Domiany 1904-1922; Czersk zgony 1941; skanów nie widziano", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}], "nw": true}, "domiana-knitter": {"g": "Domiana", "s": "Knitter", "x": "F", "y": "1879-1967", "by": 1879, "st": "confirmed", "m": "Gadzikowska", "f": [["Urodzona", "10 XII 1879 (nagrobek); USC Karsin 1879 akt 226 jako Domiana, chrzest w parafii Wiele 1879 akt 286 jako Leokadia", "likely"], ["Ślub", "1903, USC Karsin akt 24, z Janem Gadzikowskim", "likely"], ["Mieszkała", "Czersk (1907), Mokre (1909-1913)", "confirmed"], ["Zmarła", "10 I 1967, Piła (nagrobek)", "likely"], ["Pochowana", "Piła, cmentarz komunalny, 10-E/3/6", "likely"]], "note": "Pochodziła z okolic Karsina na Kaszubach. Z mężem Janem mieszkała w Czersku i Mokrem, gdzie urodziło się co najmniej dziesięcioro ich dzieci.", "how": ["Akt urodzenia syna Michała (USC Czersk 1907 nr 313, przeczytany): matka „Domianna Gadzikowski geborene Knitter”, żona robotnika Jana Gadzikowskiego z Czerska.", "Indeks Pomorski: urodzona w okręgu USC Karsin 1879 (akt 226, Domiana), ochrzczona w Wielu jako Leokadia (akt 286); rodzice Jan Knitter i Rozalia Gajewska. W aktach dzieci z Łąga (1904-1906) zapisana jako Leokadia, w 1922 jako „Damiana Knither”.", "Grób w Pile: Domiana Gadzikowska, ur. 10 XII 1879, zm. 10 I 1967. Że to ta sama osoba, prawdopodobne (rzadkie imię, zgodny rok).", "W USC Czersk (grudzień 1879), Brusy i Leśno jej urodzenia nie ma; rodzina zgłaszała się w Karsinie."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Grób Domiany Gadzikowskiej, cmentarz komunalny w Pile, sektor 10-E, rząd 3, kwatera 6", "c": "eCmentarze (dane Zarządu Dróg i Zieleni w Pile), 11 X 2026", "u": "https://www.ecmentarze.pl/cmentarz/pila-motylewska/grave/detail/4443944"}, {"t": "Czersk, urodzenia 1907, akt 313: Michał Gadzikowski", "c": "Archiwum Państwowe w Bydgoszczy, USC Czersk 6/1619/0/2.1/175, skan 314", "u": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/21514671"}, {"t": "Gadzikowscy i Knitterowie: wpisy z Indeksu Pomorskiego (Karsin, Wiele, Brusy, Łąg, Mokre, Czersk)", "c": "PTG, Indeks Pomorski: USC Karsin ur. 1879/226, małż. 1903/24, zg. 1919/31; parafia Wiele chrzty 1879/286; parafia Brusy śluby 1872/84; dzieci Jana i Domiany 1904-1922; Czersk zgony 1941; skanów nie widziano", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}], "nw": true}, "pawel-drzycimski-senior": {"g": "Paweł", "s": "Drzycimski", "x": "M", "y": "1878-?", "by": 1878, "st": "likely", "f": [["Urodzony", "1878, Przysiersk, chrzest akt 7/1878", "likely"], ["Ślub", "11 I 1903, Przysiersk, z Anastazją Lewandowską (akt 1/1903)", "likely"], ["Mieszkał", "Gelsenkirchen (1910, według rodziny)", "family"]], "note": "Pochodził z Przysierska koło Świecia. Przed 1910 rokiem wyjechał z rodziną do Zagłębia Ruhry.", "how": ["Ślub z Anastazją Lewandowską: parafia Przysiersk, 11 I 1903, akt 1, on 24 lata, ona 20 (indeks Geneteki).", "Chrzest Pawła, Przysiersk 1878 akt 7, syna Jana Drzycimskiego i Joanny Miklewicz (Niklewicz): jedyny Paweł w odpowiednim wieku.", "Możliwe: „Drzycimski Paul, ur. 24 I 1878, palacz”, akta miasta Bydgoszczy 1941-1944 (AP Bydgoszcz 6/189/0/5.1/6308, bez skanu).", "W spisach imiennych archiwum miejskiego w Gelsenkirchen (Alt-Gelsenkirchen i Schalke) nie ma żadnego Drzycimskiego."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Parafia Przysiersk, śluby 1903, akt 1: Paweł Drzycimski i Anastazja Lewandowska (indeks)", "c": "Geneteka, kujawsko-pomorskie (księgi w Archiwum Diecezjalnym w Pelplinie); skanu nie widziano", "u": "https://geneteka.genealodzy.pl/"}, {"t": "Parafia Przysiersk, chrzty 1878 akt 7, 1903 akt 67, 1904 akt 52: Drzycimscy (indeks)", "c": "Geneteka, kujawsko-pomorskie (księgi w Archiwum Diecezjalnym w Pelplinie); skanów nie widziano", "u": "https://geneteka.genealodzy.pl/"}], "nw": true}, "anastazja-lewandowska": {"g": "Anastazja", "s": "Lewandowska", "x": "F", "y": "1882-?", "by": 1882, "st": "likely", "m": "Drzycimska", "f": [["Urodzona", "1882, chrzest w Drzycimiu akt 90", "likely"], ["Ślub", "11 I 1903, Przysiersk, w wieku 20 lat", "likely"]], "how": ["Wiek z indeksu ślubu w Przysiersku 1903, akt 1.", "Możliwe: „Drzycimska Anastazja, zamieszkała w Bydgoszczy”, właścicielka osady rentowej w Jachcicach, akta banku 1926-1939 (AP Bydgoszcz 6/838/0/8/15321, bez skanu).", "Chrzest: Drzycim 1882 akt 90, córka Franciszka Lewandowskiego i Marianny Radel (Indeks Pomorski). Ta para wzięła ślub w Świeciu w 1874 roku, a w 1892 ochrzciła syna Wiktora w Przysiersku, więc rodzina mieszkała w parafii ślubu Anastazji. Wiek przy ślubie (20) się zgadza."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Parafia Przysiersk, śluby 1903, akt 1: Paweł Drzycimski i Anastazja Lewandowska (indeks)", "c": "Geneteka, kujawsko-pomorskie (księgi w Archiwum Diecezjalnym w Pelplinie); skanu nie widziano", "u": "https://geneteka.genealodzy.pl/"}, {"t": "Drzycimscy, Miklewiczowie, Lewandowscy: wpisy z Indeksu Pomorskiego (Przysiersk, Drzycim, Świecie)", "c": "PTG, Indeks Pomorski: parafia Przysiersk chrzty 1838/61, 1841/30, 1892/76; parafia Drzycim chrzty 1882/90; parafia Świecie śluby 1874; księgi w Archiwum Diecezjalnym w Pelplinie, skanów nie widziano", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}], "nw": true}, "bonifacy-janicki": {"g": "Bonifacy", "s": "Janicki", "x": "M", "y": "zmarły", "st": "family", "f": [["Urodzony", "Kcynia", "family"]], "how": ["Nie brał ślubu w USC Kcynia Miasto w latach 1900-1909 (przeczytane wszystkie akty); w Kcyni w 1910 (akty 2-97) i 1912-1913 nie urodziło się żadne jego dziecko. Śluby 1910-1914 i urodzenia od 1914 nie mają skanów.", "Możliwi krewni: Janiccy z parafii Kcynia, synowie Antoniego (śluby 1883, 1889, 1890, Poznan Project); nic ich jeszcze nie łączy z Bonifacym.", "Możliwe, że to Ignacy Janicki, robotnik w Kcyni w 1911 roku, mąż Magdaleny z Katulskich (podwójne imię albo pomyłka w drzewie); niepotwierdzone. Akt urodzenia Kazimiery (1915) nie jest dostępny online.", "Bonifacy Janicki w komisji rewizyjnej związku podoficerów rezerwy w Grudziądzu, 1926 (Goniec Nadwiślański): jedyny znaleziony Bonifacy Janicki, tożsamość nieznana."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "magdalena-janicka": {"g": "Magdalena", "s": "Janicka", "x": "F", "y": "zmarła", "st": "family", "m": "Janicka", "f": [["Urodzona", "Kcynia", "family"]], "how": ["Możliwy trop: w Kcyni 17 VI 1911 urodził się Paweł Janicki, syn robotnika Ignacego Janickiego i Magdaleny z domu Katulskiej (USC Kcynia Miasto 1911 akt 71, przeczytany). To jedyna para Janicki i Magdalena w aktach Kcyni 1910-1913; ojciec ma jednak na imię Ignacy, a nie Bonifacy."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "franciszek-krieger": {"g": "Franciszek", "s": "Krieger", "x": "M", "y": "zmarły", "st": "family", "how": ["Ślubu z Stanisławą nie ma w Poznan Project (1800-1899, Szubin i okolice) ani w Genetece, więc był raczej po 1899 roku.", "Możliwy, słaby trop: Franz Krygier/Krieger ur. 1871, śluby w Łeknie 1892 i 1894; nic go nie łączy z Szubinem."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "stanislawa-krieger": {"g": "Stanisława", "s": "Krieger", "x": "F", "y": "zmarła", "st": "family", "m": "Krieger", "how": ["Nazwisko panieńskie na drzewie zaczyna się od „Bom”, reszta zasłonięta."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}], "nw": true}, "bronislaw-nagajski": {"g": "Bronisław", "s": "Nagajski", "x": "M", "y": "zmarły", "st": "confirmed", "f": [["Zawód", "Geschäftsführer, kierownik interesu (1910)", "confirmed"], ["Wyznanie", "katolickie (1910)", "confirmed"], ["Mieszkał", "Sopot, Südstraße 32 (1910)", "confirmed"], ["Zmarł", "Grudziądz", "family"]], "how": ["Akt urodzenia córki (Gdańsk 1910 nr 2964): „Bronislaus Nagajski”, Geschäftsführer, katolik, Sopot.", "Akty zgonu jego i żony są w USC Grudziądz (nie w sieci); w bazie grobów Grudziądza ich nie ma.", "Ślubu z Ellą nie ma w Gdańsku 1903-1911 ani w Sopocie 1908-1910; w Sopocie 1900-1907 nie urodziło się żadne dziecko Nagajskich (indeksy). Śluby sopockie 1905-1907 nie mają indeksu.", "Nazwisko Nagajski występuje w okolicach Żnina i Mogilna (Polanowice 1874, Chomiąża Szlachecka); związku z Bronisławem nie znaleziono.", "Żadnego Bronisława Nagajskiego (ani Nagaj, Nogaj, Nogajewski) nie ma w indeksach Geneteki dla Pomorza i Wielkopolski. Możliwy trop: rodzina Józefa Nagajskiego (Nogajewskiego) i Walentyny Waliszewskiej, ślub w Kościelcu koło Inowrocławia 1870, dzieci w parafii Polanowice (Sukowy) 1872 i 1874."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Gdańsk, urodzenia 1910, akt 2964: Marianna Ella Nagajska", "c": "Archiwum Państwowe w Gdańsku, USC Gdańsk 10/1609, sygn. 948 (urodzenia 14 VII - 12 VIII 1910), skan 94; indeks 1910 sygn. 969, s. 75", "u": "https://genbaza.pl/metryki/td6nrdp91e/ap-gdansk-10/gdansk-1609/0948-1910-ur/94"}], "nw": true}, "ella-kotschke": {"g": "Ella", "s": "Katschack", "x": "F", "y": "zmarła", "st": "confirmed", "m": "Nagajska", "f": [["Wyznanie", "ewangelickie (1910)", "confirmed"], ["Mieszkała", "Sopot, Südstraße 32 (1910)", "confirmed"], ["Zmarła", "Grudziądz", "family"]], "note": "Matka Marianny. Nazwisko panieńskie Katschack znamy z aktu urodzenia córki.", "how": ["Akt urodzenia córki (Gdańsk 1910 nr 2964): „Ella Nagajski geborene Katschack”, nazwisko pisane wyraźnie.", "Na drzewie rodzinnym zapisano „Ko[t]schke”: to rodzinna pamięć nazwiska Katschack.", "Ślubu z Bronisławem nie ma w Gdańsku 1905-1911 ani w Sopocie 1908-1910.", "Możliwy trop: ewangelicka rodzina Katschack/Katschak w Toruniu (śluby 1865 i 1893, Poznan Project); nic jej jeszcze nie łączy z Ellą.", "Ślubu nie ma też w USC Toruń (1909 i do połowy lipca 1910), w USC Grudziądz (do 18 VIII 1910) ani w indeksie ślubów Sopotu 1908-1920 (akty i indeksy przeczytane). Śluby w Sopocie 1905-1907 nie mają indeksu i nie zostały przeczytane.", "Możliwy trop: w Toruniu w 1893 roku ożenił się Gustaw Katschak (podpis „Katschack”), robotnik, ewangelik, ur. 1862 w Brodnicy, z Henriettą Schröder (USC Toruń 1893 akt 102, przeczytany); małżeństwo rozwiązano w 1910 roku. Ella mogłaby być ich córką; żaden akt tego nie łączy."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "Gdańsk, urodzenia 1910, akt 2964: Marianna Ella Nagajska", "c": "Archiwum Państwowe w Gdańsku, USC Gdańsk 10/1609, sygn. 948 (urodzenia 14 VII - 12 VIII 1910), skan 94; indeks 1910 sygn. 969, s. 75", "u": "https://genbaza.pl/metryki/td6nrdp91e/ap-gdansk-10/gdansk-1609/0948-1910-ur/94"}], "nw": true}, "jozef-klunder": {"g": "Józef", "s": "Klunder", "x": "M", "y": "zm. 1946", "st": "likely", "f": [["Ślub", "1898, Raciąż (USC akt 1, parafia nr 69), z Anną Malzahn", "likely"], ["Zmarł", "1946", "family"]], "how": ["Ślub z Anną Malzahn: USC Raciąż 1898 akt 1 i parafia Raciąż 1898 nr 69 (Indeks Pomorski PTG). Akt ślubu poda jego wiek i rodziców.", "Jego chrztu nie znaleziono w indeksach Raciąża, Tucholi, Cekcyna i Kęsowa (1850-1880). Możliwy: Józef „Klonder”, Tuchola 1869 nr 20, syn Józefa i Marianny Krepowicz.", "Józef Klunder zmarły w Tucholi w 1938 roku w wieku 64 lat to możliwy, ale niepewny trop: drzewo rodzinne podaje 1946. W Tucholi żyło kilku Józefów Klunderów.", "Na cmentarzu w Tucholi (77 grobów Klunderów) nie ma Józefa; Teodora Klunder zm. 31 X 1946 (grób I/12/3)."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "USC Raciąż, małżeństwa 1898, akt 1, i parafia Raciąż, śluby 1898 nr 69: Józef Klunder i Anna Malzahn (indeks)", "c": "Indeks Pomorski PTG; Archiwum Państwowe w Bydgoszczy, 6/1769/0/74, obraz 2 (skanu nie widziano)", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}, {"t": "USC Raciąż, urodzenia 1899 akt 20 i 1901 akt 28: Jan i Franciszka Klunder (indeks)", "c": "Indeks Pomorski PTG; parafia Raciąż, chrzty 1899 nr 31 i 1901 nr 40", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}], "nw": true}, "nn-malzahn-klunder": {"g": "Anna", "s": "Malzahn", "x": "F", "y": "1869-1967", "by": 1869, "st": "likely", "m": "Klunder", "f": [["Urodzona", "19 X 1869 (data z nagrobka), ochrzczona w Raciążu 1869", "likely"], ["Ślub", "1898, Raciąż, z Józefem Klunderem", "likely"], ["Zmarła", "11 I 1967, Chełmno (nagrobek); drzewo rodzinne: 1965", "likely"]], "note": "Urodziła się prawdopodobnie w Raciążu koło Tucholi. Według nagrobka w Chełmnie zmarła w 1967 roku.", "how": ["Imię Anna podają indeksy ślubu z 1898 roku i urodzeń trojga dzieci (Indeks Pomorski PTG).", "Chrzest Anny Malzahn, parafia Raciąż 1869 nr 105, córki Wilhelma i Marianny z Grzonów: jedyna Anna Malzahn w tej parafii; pewność da dopiero akt ślubu z 1898 roku.", "Grób w Chełmnie: Anna Klunder, ur. 19 X 1869, zm. 11 I 1967, sama w grobie, bez nazwiska panieńskiego. Drzewo rodzinne podaje śmierć w Chełmnie w 1965 roku; rok urodzenia zgadza się z chrztem.", "Nazwisko panieńskie na drzewie: Malzahn; w indeksach także „Malzaka” i „Walzahn”.", "Zastrzeżenie: w Raciążu w 1921 roku Józef Klunder wziął ślub z Anną Milkowską (Geneteka). To raczej inny Józef (ur. 1896), ale gdyby to był ojciec Leona, „Anna Klunder” z Chełmna mogłaby być drugą żoną."], "src": [{"t": "Rodzinne drzewo Nicole Klunder (plakat „Drzewo mojej rodziny”, od Krzysztofa Klundra)", "c": "dokument rodzinny, sfotografowany 11 X 2026", "u": ""}, {"t": "USC Raciąż, małżeństwa 1898, akt 1, i parafia Raciąż, śluby 1898 nr 69: Józef Klunder i Anna Malzahn (indeks)", "c": "Indeks Pomorski PTG; Archiwum Państwowe w Bydgoszczy, 6/1769/0/74, obraz 2 (skanu nie widziano)", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}, {"t": "Parafia Raciąż: chrzest 1869 nr 105 (Anna Malzahn), ślub 1869 nr 104; USC Raciąż, zgony 1886 akt 9; parafia Tuchola, zgony 1920 nr 34 (indeks)", "c": "Indeks Pomorski PTG", "u": "https://www.ptg.gda.pl/language/pl/pomgenbaza/przeszukiwanie-rejestrow-metrykalnych/"}, {"t": "Grób Anny Klunder, cmentarz komunalny w Chełmnie, sektor 6, rząd 4, miejsce 22", "c": "wyszukiwarka grobów cmentarza w Chełmnie, 11 X 2026", "u": "https://cmentarzchelmno.pl/wyswietl.php?id_miejsce=4422"}], "nw": true}, "katarzyna-dworczynska-1881": {"g": "Katarzyna", "s": "Dworczyńska", "x": "F", "y": ", "short": "1901 · ślub", "when": "Międzychód, 18 października 1901", "img": "img/1901-marriage-dworczynski-walkowiak.jpg", "cap": "USC Międzychód (powiat śremski), księga małżeństw, nr 3/1901", "cite": "Archiwum Państwowe w Poznaniu, jednostka 1404673, skan 30", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/1404673", "site": "szukajwarchiwach.gov.pl", "orig": "Sohn des Häuslers Johann (Jan) Dworczynski und dessen Ehefrau Marie, geborene Łagoda", "reading": "Rodzice Kazimierza. Franciszek, robotnik, urodzony 22 października 1878 w Drzonku; Katarzyna urodzona 17 października 1882 w Pokrzywnicy.", "points": ["Rodzice pana młodego: Jan Dworczyński, chałupnik z Drzonka, i Marianna z Łagodów.", "Rodzice panny młodej: Andrzej Walkowiak, owczarz z Międzychodu, i Marianna z Juskowiaków.", "Jan i Marianna wzięli ślub w parafii Dolsk w 1869 roku (indeks Poznan Project)."], "people": ["kazimierz-dworczynski-1910", "franciszek-dworczynski-1878", "katarzyna-walkowiak-1882", "jan-dworczynski-1844", "marianna-lagoda-1843", "andrzej-walkowiak-1853", "marianna-juskowiak-1859"], "thumb": "img/thumb/1901-marriage-dworczynski-walkowiak.jpg", "w": 900, "h": 1869, "cat": "sluby"}, "b1911": {"title": "Akt chrztu Stefana Kazimierczaka", "short": "1911 · chrzest", "when": "Dobrzec pod Kaliszem, 28 sierpnia 1911", "img": "img/1911-birth-stefan.jpg", "cap": "Parafia św. Michała w Dobrzecu, akt urodzenia nr 121/1911 (po rosyjsku)", "cite": "Archiwum Państwowe w Kaliszu, 11/674/0/-/41, skan 65", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11948291", "site": "szukajwarchiwach.gov.pl", "orig": "Иосифъ Казимерчакъ (Józef Kazimierczak) … Антонины урожденной Домбковской (Antoniny z Dąbkowskich)", "reading": "Józef Kazimierczak, wyrobnik, lat 48, okazuje syna urodzonego 15/28 sierpnia 1911 roku z żony Antoniny z Dąbkowskich, lat 40. Dziecku nadano imię Stefan.", "points": ["Chrzestni: Daniel(?) Dąbkowski i Łucja Kazimierczak.", "Czworo rodzeństwa z tej samej pary zgadza się z drzewem: Władysław 1905, Marianna 1909, Kazimierz 1913, Jadwiga 1915. Piąty, Antoni (1907), nie jest w drzewie.", "W akcie omyłkowo zapisano „младенца женскаго пола” (dziecię płci żeńskiej), ale imię Stefan i dalsza część aktu nie zostawiają wątpliwości."], "people": ["stefan-kazimierczak-1911", "jozef-kazimierczak-1863", "antonina-dabkowska-1871"], "thumb": "img/thumb/1911-birth-stefan.jpg", "w": 1100, "h": 754, "cat": "urodzenia"}, "m1893": {"title": "Ślub Józefa Kazimierczaka i Antoniny Dąbkowskiej", "short": "1893 · ślub", "when": "Tykadłów, 22 stycznia 1893", "img": "img/1893-marriage-kazimierczak-dabkowska.jpg", "cap": "Parafia Tykadłów, księga z 1893 roku, akt małżeństwa nr 2 (po rosyjsku)", "cite": "Archiwum Państwowe w Kaliszu, 11/764/0/1/69, skan 19", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11961703", "site": "szukajwarchiwach.gov.pl", "orig": "Іосифомъ Казимерчакомъ (Józefem Kazimierczakiem) вдовцомъ … Антониною Домбковскою (Antoniną Dąbkowską) девицею", "reading": "Józef, wdowiec, lat 28, urodzony w Czartkach, zamieszkały w Borkowie, syn zmarłego Stanisława i żyjącej Katarzyny. Antonina, panna, lat 22, służąca, urodzona i zamieszkała w Russowie, córka zmarłych Ludwika i Agnieszki z Kurów(?), komorników.", "points": ["Akt powyżej to ślub jej siostry Marianny Dąbkowskiej, tych samych rodziców.", "Józef był w 1893 roku już wdowcem, więc miał wcześniej inną żonę."], "extra": {"img": "img/1893-margin-1950-death.jpg", "cap": "Adnotacja dopisana na marginesie w 1950 roku", "orig": "Zmarł Józef dnia 1.III.50 w Kaliszu · Nr 173/50", "reading": "Józef zmarł 1 marca 1950 roku w Kaliszu, akt zgonu nr 173/1950. W drzewie był rok 1950.", "w": 900, "h": 204}, "people": ["jozef-kazimierczak-1863", "antonina-dabkowska-1871", "stanislaw-kazimierczak-1819", "katarzyna-kubiak-1823", "ludwik-dabkowski-1845", "agnieszka-kurz-1835"], "thumb": "img/thumb/1893-marriage-kazimierczak-dabkowska.jpg", "w": 1100, "h": 785, "cat": "sluby"}, "b1917": {"title": "Akt chrztu Kazimierza Kokocińskiego", "short": "1917 · chrzest", "when": "Brzeźnio, 1 stycznia 1917", "img": "img/1917-birth-kazimierz-kokocinski.jpg", "cap": "Parafia Brzeźnio, powiat sieradzki, urodzenia 1917, akt nr 2", "cite": "Archiwum Państwowe w Łodzi · skan w metryki.genealodzy.pl, id218-sy1917-kt1, plik 001-002", "url": "https://metryki.genealodzy.pl/id218-sy1917-kt1", "site": "metryki.genealodzy.pl", "orig": "Stawił się Walenty Kokociński, gospodarz, lat trzydzieści sześć … i Antoniego Żyśko, gospodarza z Pustelnika, lat pięćdziesiąt sześć … z jego małżonki Józefy z Żyśków", "reading": "Walenty Kokociński, gospodarz z Pustelnika, lat 36, okazuje syna urodzonego 28 grudnia 1916 roku z żony Józefy z Żyśków, lat 28. Dziecku nadano imię Kazimierz. Jednym ze świadków był Antoni Żyśko, gospodarz z Pustelnika, lat 56.", "points": ["Późniejsza adnotacja odnotowuje zgon w Śremie 3 marca 2011 roku, co zgadza się z grobem, w którym leżą też Anna i Roman Szafrański.", "Drugi świadek pochodził prawdopodobnie z Ostrowa(?), wsi w tej samej parafii.", "W 1916 roku w tym samym kościele wzięła ślub Ludwika Żyśko, zapewne siostra Józefy."], "people": ["kazimierz-kokocinski-1916", "walenty-kokocinski-1881", "jozefa-zesko-1887", "antoni-zesko-1857"], "thumb": "img/thumb/1917-birth-kazimierz-kokocinski.jpg", "w": 1000, "h": 931, "cat": "urodzenia"}, "z1892": {"title": "Żeśkowie w Tykadłowie", "short": "1892 · urodzenie", "when": "Tykadłów 1892 · Brzeźnio 1916", "img": "img/1892-birth-ludwika-zesko.jpg", "cap": "Tykadłów, urodzenia 1892, akt nr 20 (po rosyjsku)", "cite": "Archiwum Państwowe w Kaliszu, 11/764/0/1/68, skan 10 · Brzeźnio, małżeństwa 1916, akt 39, metryki.genealodzy.pl id218-sy1916-kt2", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11961702", "site": "szukajwarchiwach.gov.pl", "orig": "Антоній Жесько (Antoni Żeśko), коморникъ изъ Тыкадлова … Іосифы урожденной Шимчаковой (Józefy z Szymczaków)", "reading": "W lipcu 1892 roku Antoni Żeśko, komornik z Tykadłowa, lat 34, zgłasza córkę Ludwikę urodzoną z żony Józefy z Szymczaków, lat 30. To ci sami Antoni i Józefa, którzy są w drzewie jako rodzice Józefy Kokocińskiej.", "points": ["Ojciec chrzestny: Józef Żeśko, lat 28, zapewne brat Antoniego.", "W tej samej parafii Tykadłów w 1893 roku pobrali się Józef Kazimierczak i Antonina Dąbkowska. W latach 90. XIX wieku Kazimierczakowie i Żeśkowie mieszkali w tej samej parafii."], "extra": {"img": "img/1916-marriage-ludwika-zysko.jpg", "cap": "Brzeźnio, małżeństwa 1916, akt nr 39", "orig": "Ludwiką Żyśko, panną lat dwadzieścia cztery, urodzoną w Tykadłowie … córką żyjących Antoniego i Józefy z Szymczaków", "reading": "W 1916 roku Ludwika, lat 24, urodzona w Tykadłowie, bierze ślub w Brzeźniu. Mieszka przy rodzicach Antonim i Józefie z Szymczaków w Pustelniku. To łączy Żeśków z Tykadłowa z Żyśkami z Pustelnika.", "w": 1100, "h": 457}, "people": ["antoni-zesko-1857", "jozefa-szymczak-1858", "ludwika-zesko-1892"], "thumb": "img/thumb/1892-birth-ludwika-zesko.jpg", "w": 1100, "h": 465, "cat": "urodzenia"}, "b1863": {"title": "Akt chrztu Józefa Kazimierczaka", "short": "1863 · chrzest", "when": "Borków, 4 lutego 1863", "img": "img/1863-birth-jozef-kazimierczak.jpg", "cap": "Parafia Borków, urodzenia 1863, akt nr 8", "cite": "Archiwum Państwowe w Kaliszu, 11/657/0/1/39, skan 5", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/29541489", "site": "szukajwarchiwach.gov.pl", "orig": "Stawił się Stanisław Kaźmierczak, wyrobnik lat czterdzieści pięć, w Czartkach zamieszkały … z jego małżonki Katarzyny z Kubiaków lat czterdzieści", "reading": "Stanisław Kaźmierczak, wyrobnik z Czartek, lat 45, zgłasza syna urodzonego 3 lutego 1863 roku z żony Katarzyny z Kubiaków, lat 40. Dziecku nadano imię Józef.", "points": ["Na marginesie: „Zmarł w Kaliszu dn. 1 marca 1950, USC Kalisz nr 173/50”. Ta sama adnotacja co na akcie ślubu z 1893 roku, więc to na pewno ten sam Józef.", "Drzewo podawało rok 1863. Zgadza się."], "people": ["jozef-kazimierczak-1863", "stanislaw-kazimierczak-1819", "katarzyna-kubiak-1823"], "thumb": "img/thumb/1863-birth-jozef-kazimierczak.jpg", "w": 1100, "h": 684, "cat": "urodzenia"}, "m1879": {"title": "Ślub Antoniego Żeśki i Józefy Szymczak", "short": "1879 · ślub", "when": "Tykadłów, listopad 1879", "img": "img/1879-marriage-zesko-szymczak.jpg", "cap": "Parafia Tykadłów, małżeństwa 1879, akt nr 9 (po rosyjsku)", "cite": "Archiwum Państwowe w Kaliszu, 11/764/0/1/55, skany 17-18 · urodzenia 1857 akt 12 i 1858 akt 5", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11961689", "site": "szukajwarchiwach.gov.pl", "orig": "Антоніемъ Ржеско (Antoni Rzeszko) … сыномъ Вавржинца и Розаліи урожденной Хржановской … Іосифою Шимчакъ (Józefa Szymczak) … дочерью Іосифа и Эльжбеты урожденной Жарнецкой", "reading": "Antoni, kawaler, lat 22, urodzony i zamieszkały w Tykadłowie, syn Wawrzyńca i Rozalii z Chrzanowskich. Józefa, panna, lat 21, urodzona w Tykadłowie, córka Józefa i Elżbiety z Żarneckich. Obie rodziny to komornicy.", "points": ["Akt chrztu Antoniego: 20 maja 1857, Tykadłów, ojciec Wawrzyniec lat 34, matka Rozalia z Chrzanowskich lat 23.", "Akt chrztu Józefy: 22 lutego 1858, Tykadłów, ojciec Józef Szymczak lat 43, matka Elżbieta z Żarneckich lat 31.", "Nazwisko w aktach: Rześko, Rzeszko, Żeśko, Żyśko. To jedna rodzina."], "people": ["antoni-zesko-1857", "jozefa-szymczak-1858", "wawrzyniec-zesko-1829", "rozalia-chrzanowska-1832", "jozef-szymczak-1815", "elzbieta-zarnecka-1827"], "thumb": "img/thumb/1879-marriage-zesko-szymczak.jpg", "w": 1100, "h": 604, "cat": "sluby"}, "b1887": {"title": "Akt chrztu Józefy Żeśko (Kokocińskiej)", "short": "1887 · chrzest", "when": "Tykadłów, 25 marca 1887", "img": "img/1887-birth-jozefa-zesko.jpg", "cap": "Parafia Tykadłów, urodzenia 1887, akt nr 7 (po rosyjsku)", "cite": "Archiwum Państwowe w Kaliszu, 11/764/0/1/63, skan 6", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11961697", "site": "szukajwarchiwach.gov.pl", "orig": "Жесько Антони (Zyśko Antoni), коморникъ … отъ законной его жены Юзефы урожденной Шымчакъ", "reading": "Antoni Żeśko, komornik z Tykadłowa, lat 30, zgłasza córkę urodzoną 19 marca 1887 roku z żony Józefy z Szymczaków, lat 25. Dziecku nadano imię Józefa.", "points": ["Na marginesie: „zmarła dnia 10.12.1980 r. w Tykadłowie, USC Żelazków nr 57/80”. Zmarła więc w Tykadłowie, a nie w Jaszkowie, jak podaje drzewo.", "Brat Józefy, Stanisław Żyśko, wziął ślub w Brzeźniu w 1917 roku; według indeksu Geneteki akt podaje tych samych rodziców."], "people": ["jozefa-zesko-1887", "antoni-zesko-1857", "jozefa-szymczak-1858"], "thumb": "img/thumb/1887-birth-jozefa-zesko.jpg", "w": 1100, "h": 527, "cat": "urodzenia"}, "m1877": {"title": "Ślub Andrzeja Walkowiaka i Marianny Juskowiak", "short": "1877 · ślub", "when": "Borek, 25 sierpnia 1877", "img": "img/1877-marriage-walkowiak-juskowiak.jpg", "cap": "USC Borek, małżeństwa 1877, akt nr 23", "cite": "Archiwum Państwowe w Lesznie, 34/407/0/2.1/20, skan 48 · urodzenie Katarzyny: USC Dolsk 1882 nr 303", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/2756296", "site": "szukajwarchiwach.gov.pl", "orig": "der Knecht Andrzej Walkowiak … geboren den siebenzehnten November 1853 zu Jawory … Sohn des zu Pokrzywnica verstorbenen Häuslers Franz Walkowiak und dessen Ehefrau Józepha geb. Pawlak", "reading": "Parobek Andrzej Walkowiak, ur. 17 listopada 1853 w Jaworach, zamieszkały w Pokrzywnicy, syn zmarłego chałupnika Franciszka Walkowiaka i Józefy z Pawlaków, poślubia Mariannę Juskowiak, ur. 6 stycznia 1859 w Wziąchowie, córkę Michała Juskowiaka i Katarzyny z Płonków z Głoginina.", "points": ["Ich córka Katarzyna urodziła się 17 października 1882 w Pokrzywnicy (USC Dolsk, akt 303/1882), a w 1901 roku wyszła za Franciszka Dworczyńskiego.", "Rodzeństwo Katarzyny: Michał 1880, Weronika 1887, Marianna 1897, Stanisław 1899, Stanisława 1905."], "people": ["katarzyna-walkowiak-1882", "andrzej- rs Matthias Rychlewicz … zu Wieszczyczyn … am ersten Dezember … tausend neunhundert vierzehn nachmittags um drei Uhr ein Knabe … Anton", "reading": "Akuszerka Jadwiga Rubach z Dolska zgłasza 7 grudnia 1914, że Anna Rychlewicz z domu Włodarczak, żona robotnika folwarcznego Macieja Rychlewicza z Wieszczyczyna, urodziła 1 grudnia 1914 o trzeciej po południu syna, któremu nadano imię Antoni.", "points": ["Data zgadza się co do dnia z nagrobkiem w Śremie.", "Rodzeństwo według indeksu BaSIA: Marianna 1908 i Jan 1910 (Mechlin, USC Śrem), Teofil 1912 (Russocin, USC Dolsk)."], "people": ["antoni-rychlewicz-1914", "maciej-rychlewicz-1880", "anna-wlodarczak-1886"], "thumb": "img/thumb/1914-birth-antoni-rychlewicz.jpg", "w": 900, "h": 1181, "cat": "urodzenia"}, "m1904": {"title": "Ślub Macieja Rychlewicza i Anny Włodarczak", "short": "1904 · ślub", "when": "Śrem, 29 kwietnia 1904", "img": "img/1904-marriage-rychlewicz-wlodarczak.jpg", "cap": "USC Śrem, małżeństwa 1904, nr 20", "cite": "Archiwum Państwowe w Poznaniu, 53/1963/0/2/221, skan 42 · urodzenie Anny: USC Śrem 1886 nr 319", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/1414164", "site": "szukajwarchiwach.gov.pl", "orig": "der Bergmann Mathias (Maciej) Rychlewicz … geboren am siebenzehnten Februar … achtzig zu Tulce … Sohn des Arbeiters Valentin Rychlewicz zu Rogalin und dessen verstorbenen Ehefrau Victoria geborenen Wojtkowiak … Tochter des zu Mechlin verstorbenen Wirts Roch Włodarczak und dessen Ehefrau Marianna geborenen Cikowiak", "reading": "Górnik Maciej Rychlewicz, ur. 17 lutego 1880 w Tulcach, mieszkający w Osterfeld (Zagłębie Ruhry), syn robotnika Walentego Rychlewicza z Rogalina i zmarłej Wiktorii z Wojtkowiaków, poślubia Annę Włodarczak, ur. w lipcu 1886 w Mechlinie, córkę zmarłego gospodarza Rocha Włodarczaka i Marianny z Cikowiaków.", "points": ["Pieczątka na marginesie: żona zmarła 13 lipca 1958 w Mechlinie (USC Mechlin 4/1958).", "Akt urodzenia Anny (USC Śrem 1886, nr 319) podaje tych sa
