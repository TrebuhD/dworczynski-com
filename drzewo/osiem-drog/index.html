<style>html { -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  --paper: #eceee8; --leaf: #f6f7f3; --ink: #1f1d1a; --ink-soft: #4f4d47; --rule: #c4c7bc; --rule-strong: #a9ad9f;
  --stamp: #4f3d86; --stamp-ink: #ffffff;
  --s-confirmed: #2e6b4f; --s-likely: #8c5a0a; --s-family: #5c636d; --s-living: #5e5287; --s-empty: #e2e4dd; --seg-text: #ffffff;
  --c-confirmed: #2e6b4f; --c-likely: #8c5a0a; --c-family: #5c636d; --c-living: #5e5287;
  --shadow: 0 1px 3px rgba(0,0,0,.12);
  --font-display: "Libre Caslon Display", "Libre Caslon Text", Georgia, serif;
  --font-body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16181b; --leaf: #202328; --ink: #ece9e1; --ink-soft: #b9b6ad; --rule: #3c4047; --rule-strong: #5a6068;
    --stamp: #bcaaf0; --stamp-ink: #16181b;
    --s-confirmed: #6cc196; --s-likely: #e3b25a; --s-family: #a3abb6; --s-living: #b4a6e0; --s-empty: #23272c; --seg-text: #15171a;
    --c-confirmed: #84d4aa; --c-likely: #eec36e; --c-family: #b7bfca; --c-living: #c4b6ee;
    --shadow: 0 1px 3px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16181b; --leaf: #202328; --ink: #ece9e1; --ink-soft: #b9b6ad; --rule: #3c4047; --rule-strong: #5a6068;
  --stamp: #bcaaf0; --stamp-ink: #16181b;
  --s-confirmed: #6cc196; --s-likely: #e3b25a; --s-family: #a3abb6; --s-living: #b4a6e0; --s-empty: #23272c; --seg-text: #15171a;
  --c-confirmed: #84d4aa; --c-likely: #eec36e; --c-family: #b7bfca; --c-living: #c4b6ee;
  --shadow: 0 1px 3px rgba(0,0,0,.5); color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
a { color: var(--stamp); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
img { max-width: 100%; }
button { font: inherit; color: inherit; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--stamp); color: var(--stamp-ink); padding: 10px 16px; border-radius: 6px; z-index: 60; text-decoration: none; }
.skip:focus { top: 8px; }
.soft { color: var(--ink-soft); }

/* header */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand links" "search search"; gap: 6px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--rule); background: var(--paper); position: relative; z-index: 30; }
.brand { grid-area: brand; font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.links { grid-area: links; display: flex; gap: 4px; }
.links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px; border-radius: 8px; color: var(--ink-soft); text-decoration: none; font-size: 0.95rem; }
.links a:hover { color: var(--stamp); text-decoration: underline; }
.links a[aria-current] { color: var(--stamp); font-weight: 500; }
.search { grid-area: search; position: relative; }
.search input { width: 100%; min-height: 44px; font: inherit; font-size: 1rem; padding: 8px 12px 8px 36px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--leaf); color: var(--ink); }
.search input::placeholder { color: var(--ink-soft); opacity: 1; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-soft); pointer-events: none; }
.search ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--leaf); border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: var(--shadow); max-height: 60vh; overflow: auto; z-index: 40; }
.search li { padding: 8px 10px; border-radius: 6px; cursor: pointer; min-height: 44px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
.search li span { color: var(--ink-soft); font-size: 0.92rem; }
.search li[aria-selected="true"] { background: var(--stamp); color: var(--stamp-ink); }
.search li[aria-selected="true"] span { color: inherit; }
.search li.none { cursor: default; color: var(--ink-soft); }
@media (max-width: 480px) { .links a { padding: 0 7px; font-size: .9rem; } .top { column-gap: 8px; } }
@media (min-width: 760px) {
  .top { grid-template-columns: auto minmax(0, 380px) 1fr; grid-template-areas: "brand search links"; padding: 8px 20px; }
  .links { justify-self: end; }
}

/* tree view */
main { min-height: 0; position: relative; }
.tree-view { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); position: relative; }
@media (min-width: 900px) { .tree-view { grid-template-columns: minmax(0, 1fr) 380px; } }
.stage { position: relative; overflow: hidden; min-height: 0; padding-bottom: 76px; }
@media (min-width: 900px) { .stage { padding-bottom: 0; } }
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#chart.panning { cursor: grabbing; }
#vp > g { transition: opacity .18s ease-out; }
#vp.leave > g { opacity: 0.25; }
#vp > g.enter { animation: enter .34s ease-out; }
@keyframes enter { from { opacity: 0; } to { opacity: 1; } }
.seg { stroke: var(--paper); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.node { cursor: pointer; outline: none; }
.node:hover .seg { stroke: var(--ink); stroke-width: 2; }
.node:focus-visible .seg { stroke: var(--stamp); stroke-width: 4; }
.seg.line { stroke: var(--ink); stroke-width: 2.5; }
.seg.centre { stroke: var(--ink); stroke-width: 2; }
.seg.empty { fill: var(--s-empty); stroke: var(--rule-strong); stroke-dasharray: 3 3; stroke-width: 1; }
.f-confirmed { fill: var(--s-confirmed); background: var(--s-confirmed); }
.f-likely { fill: var(--s-likely); background: var(--s-likely); }
.f-family { fill: var(--s-family); background: var(--s-family); }
.f-living { fill: var(--s-living); background: var(--s-living); }
.node.sel .seg { stroke: var(--stamp); stroke-width: 4; }
.lab { fill: var(--seg-text); font-family: var(--font-body); pointer-events: none; }
.lab .b { font-weight: 700; }
.tools { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
.tools > * { pointer-events: auto; }
.modes { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.modes legend { float: left; font-size: 0.9rem; color: var(--ink-soft); margin-right: 6px; padding: 0; }
.modes .opts { display: inline-flex; background: var(--leaf); border: 1px solid var(--rule-strong); border-radius: 999px; padding: 2px; box-shadow: var(--shadow); }
.modes label { position: relative; }
.modes input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.modes span { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 0.92rem; white-space: nowrap; color: var(--ink); }
.modes input:checked + span { background: var(--stamp); color: var(--stamp-ink); font-weight: 500; }
.modes input:focus-visible + span { outline: 3px solid var(--stamp); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.85rem; color: var(--ink-soft); background: color-mix(in srgb, var(--paper) 85%, transparent); border-radius: 8px; padding: 2px 6px; margin: 0; list-style: none; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 13px; height: 13px; border-radius: 3px; display: inline-block; flex: none; }
.sw.empty { background: var(--s-empty); border: 1px dashed var(--rule-strong); }
.zoom { position: absolute; right: 12px; bottom: 12px; display: grid; gap: 6px; }
@media (max-width: 899px) { .zoom { bottom: 88px; } }
.zoom button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--leaf); color: var(--ink); cursor: pointer; font-size: 1.3rem; line-height: 1; box-shadow: var(--shadow); display: grid; place-items: center; }
.zoom button:hover { border-color: var(--stamp); color: var(--stamp); }
.zoom svg { width: 18px; height: 18px; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 0.85rem; color: var(--ink-soft); max-width: calc(100% - 80px); pointer-events: none; background: color-mix(in srgb, var(--paper) 88%, transparent); padding: 2px 8px; border-radius: 6px; }
@media (max-width: 899px) { .hint { display: none; } }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 8px; font-size: 0.92rem; line-height: 1.35; max-width: 280px; box-shadow: var(--shadow); }
.tip span { opacity: .85; }

/* tree view */
.tline { fill: none; stroke: var(--rule-strong); stroke-width: 1.6; }
.tnode .box { fill: var(--leaf); stroke: var(--rule-strong); stroke-width: 1; }
.tnode .stripe { stroke: none; }
.tnode.line .box { stroke: var(--ink); stroke-width: 1.4; }
.tnode.centre .box { fill: color-mix(in srgb, var(--stamp) 14%, var(--leaf)); stroke: var(--stamp); stroke-width: 2.5; }
.tnode:hover .box { stroke: var(--stamp); }
.tnode.sel .box { stroke: var(--stamp); stroke-width: 4; }
.tnode:focus-visible .box { stroke: var(--stamp); stroke-width: 4; stroke-dasharray: 6 3; }
.tn { font-family: var(--font-body); font-weight: 700; font-size: 14px; fill: var(--ink); pointer-events: none; }
.ty { font-family: var(--font-body); font-size: 12.5px; fill: var(--ink-soft); pointer-events: none; font-variant-numeric: tabular-nums; }
.chip { cursor: pointer; outline: none; }
.chip rect { fill: var(--paper); stroke: var(--stamp); stroke-width: 1.4; }
.chip text { font-family: var(--font-body); font-size: 13px; font-weight: 700; fill: var(--stamp); pointer-events: none; }
.chip:hover rect { fill: var(--stamp); } .chip:hover text { fill: var(--stamp-ink); }
.chip:focus-visible rect { stroke-width: 3.5; }

/* panel: right column on desktop, bottom sheet on phones */
.panel { background: var(--leaf); border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.p-head { padding: 16px 18px 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; border-bottom: 1px solid var(--rule); }
.p-head h2 { font-size: 1.55rem; grid-column: 1; }
.p-head .sub { grid-column: 1; color: var(--ink-soft); font-size: 1rem; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
#p-toggle { display: none; grid-column: 2; grid-row: 1 / span 2; align-self: center; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--stamp); background: var(--leaf); color: var(--stamp); cursor: pointer; font-weight: 500; }
.p-body { overflow: auto; padding: 14px 18px 28px; display: grid; gap: 14px; align-content: start; overscroll-behavior: contain; }
.p-body h3 { font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); margin-top: 6px; }
.p-body .alt { color: var(--ink-soft); }
.p-body .rel { color: var(--stamp); font-size: 1.08rem; font-weight: 500; }
.p-body .note { font-size: 1rem; }
.p-body .small { font-size: 0.9rem; }
.centre-btn { justify-self: start; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--stamp); background: var(--stamp); color: var(--stamp-ink); cursor: pointer; font-weight: 500; }
.stories { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.story-link { display: grid; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--rule); border-left: 4px solid var(--stamp); background: var(--paper); color: var(--ink); text-decoration: none; }
.story-link:hover { border-color: var(--stamp); }
.story-link b { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; color: var(--stamp); }
.story-link span { font-size: 0.92rem; color: var(--ink-soft); }
@media (max-width: 899px) {
  .panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; border-left: 0; border-top: 1px solid var(--rule-strong); border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.18); max-height: 76px; transition: max-height .25s ease; }
  .panel.open { max-height: 72%; }
  .p-head { padding: 10px 16px; border-bottom: 0; min-height: 76px; align-content: center; }
  .p-head h2 { font-size: 1.25rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel.open .p-head { border-bottom: 1px solid var(--rule); }
  #p-toggle { display: inline-flex; align-items: center; }
  .panel:not(.open) .p-body { visibility: hidden; }
}
.word { display: inline-block; font-size: 0.85rem; padding: 0 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; line-height: 1.6; }
.word.confirmed { color: var(--c-confirmed); } .word.likely { color: var(--c-likely); } .word.family { color: var(--c-family); } .word.living { color: var(--c-living); }
dl.facts { display: grid; grid-template-columns: minmax(0, 1fr); margin: 0; }
dl.facts dt { font-size: 0.85rem; color: var(--ink-soft); margin-top: 8px; }
dl.facts dd { margin: 0; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.plinks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.plinks .pl { display: grid; grid-template-columns: 13px minmax(0, 1fr) auto; gap: 0 10px; align-items: center; min-height: 44px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); text-decoration: none; }
.plinks .pl:hover { border-color: var(--stamp); }
.plinks .nm { font-weight: 500; }
.plinks .yr { color: var(--ink-soft); font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.plinks .ex { grid-column: 2 / span 2; color: var(--ink-soft); font-size: 0.88rem; }
.plinks .none { color: var(--ink-soft); font-size: 0.92rem; padding: 4px 10px; }
.fam { display: grid; gap: 8px; }
.thumbs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); }
.thumb { display: grid; gap: 6px; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; align-content: start; }
.thumb:hover { border-color: var(--stamp); }
.thumb img { width: 100%; height: 110px; object-fit: cover; object-position: top; border-radius: 6px; background: var(--leaf); display: block; }
.thumb .t { font-weight: 500; font-size: 0.95rem; line-height: 1.3; }
.thumb .y { color: var(--ink-soft); font-size: 0.88rem; }
.graves { padding-left: 1.1em; margin: 0; }
details { border-top: 1px solid var(--rule); padding-top: 4px; }
summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 500; color: var(--stamp); }
.srcs { padding-left: 1.1em; margin: 6px 0 0; font-size: 0.95rem; }
.srcs li { margin: 6px 0; overflow-wrap: anywhere; }

/* pages: stories, documents */
.page { height: 100%; overflow: auto; padding: 20px 16px 80px; }
.page > * { max-width: 760px; margin-inline: auto; }
.page > * + * { margin-top: 20px; }
.page h1 { font-size: clamp(2rem, 6vw, 2.8rem); }
.page h1:focus { outline: none; }
.back { display: inline-flex; align-items: center; min-height: 44px; }
.page .thumbs { max-width: 1000px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.page .thumb img { height: 150px; }
.toc { padding-left: 1.3em; }
.toc a { display: inline-flex; min-height: 40px; align-items: center; }
article.story { background: var(--leaf); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; scroll-margin-top: 16px; }
article.story > * + * { margin-top: 12px; }
article.story .lead { font-size: 1.08rem; color: var(--ink-soft); }
.gravelist { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 12px; }
.gravelist > li { background: var(--leaf); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.gravelist ul { margin: 0; padding-left: 1.1em; }

/* document viewer */
#viewer-root { position: fixed; inset: 0; z-index: 50; }
.viewer { position: absolute; inset: 0; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.viewer .bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.viewer .bar h2 { font-size: 1.15rem; margin-right: auto; min-width: 0; }
.chip { min-height: 44px; min-width: 44px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--leaf); cursor: pointer; font-size: 1rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--stamp); background: var(--stamp); color: var(--stamp-ink); text-decoration: none; font-weight: 500; }
.viewer .body { display: grid; grid-template-rows: minmax(40vh, 1fr) auto; min-height: 0; overflow: auto; }
.viewer .img { overflow: auto; background: #111; min-height: 40vh; touch-action: pan-x pan-y pinch-zoom; cursor: grab; }
.viewer .img img { display: block; width: 100%; max-width: none; margin: 0 auto; }
.viewer .read { padding: 16px; overflow: auto; }
.viewer .read > * + * { margin-top: 12px; }
@media (min-width: 900px) { .viewer .body { grid-template-rows: none; grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr); overflow: hidden; } .viewer .img { min-height: 0; } }
.reading { border-left: 4px solid var(--stamp); padding-left: 14px; }
.orig { font-family: var(--font-mono); font-size: 0.9rem; color: var(--ink-soft); overflow-wrap: anywhere; }
ul.points { padding-left: 1.2em; margin: 0; }
.sub { color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* map page (osiem-drog/): OpenStreetMap with people per year, timeline at the bottom, the tree page's panel on the side */
:root { --side-o: #2a78d6; --side-m: #eb6834; --side-x: #1baf7a; --halo: #ffffff; --tile-filter: saturate(.45) contrast(.94) brightness(1.03); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --side-o: #3987e5; --side-m: #d95926; --side-x: #199e70; --halo: #16181b;
  --tile-filter: invert(1) hue-rotate(180deg) saturate(.35) brightness(.82) contrast(.92); } }
:root[data-theme="dark"] { --side-o: #3987e5; --side-m: #d95926; --side-x: #199e70; --halo: #16181b; --tile-filter: invert(1) hue-rotate(180deg) saturate(.35) brightness(.82) contrast(.92); }

.map-view .stage { padding-bottom: 0; }
#map { position: absolute; inset: 0; background: var(--paper); z-index: 0; }
@media (max-width: 899px) { #map { bottom: 76px; } }
.leaflet-container { font-family: var(--font-body); background: var(--paper); }
.leaflet-tile-pane { filter: var(--tile-filter); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--leaf); color: var(--ink); border-bottom-color: var(--rule); width: 36px; height: 36px; line-height: 36px; }

1835"], "thumb": "img/thumb/1893-marriage-kazimierczak-dabkowska.jpg", "w": 1100, "h": 785}, "b1917": {"title": "Akt chrztu Kazimierza Kokocińskiego", "short": "1917 · chrzest", "when": "Brzeźnio, 1 stycznia 1917", "img": "img/1917-birth-kazimierz-kokocinski.jpg", "cap": "Parafia Brzeźnio, powiat sieradzki, urodzenia 1917, akt nr 2", "cite": "Archiwum Państwowe w Łodzi · skan w metryki.genealodzy.pl, id218-sy1917-kt1, plik 001-002", "url": "https://metryki.genealodzy.pl/id218-sy1917-kt1", "site": "metryki.genealodzy.pl", "orig": "Stawił się Walenty Kokociński, gospodarz, lat trzydzieści sześć … i Antoniego Żyśko, gospodarza z Pustelnika, lat pięćdziesiąt sześć … z jego małżonki Józefy z Żyśków", "reading": "Walenty Kokociński, gospodarz z Pustelnika, lat 36, okazuje syna urodzonego 28 grudnia 1916 roku z żony Józefy z Żyśków, lat 28. Dziecku nadano imię Kazimierz. Jednym ze świadków był Antoni Żyśko, gospodarz z Pustelnika, lat 56.", "points": ["Późniejsza adnotacja odnotowuje zgon w Śremie 3 marca 2011 roku, co zgadza się z grobem, w którym leżą też Anna i Roman Szafrański.", "Drugi świadek pochodził prawdopodobnie z Ostrowa(?), wsi w tej samej parafii.", "W 1916 roku w tym samym kościele wzięła ślub Ludwika Żyśko, zapewne siostra Józefy."], "people": ["kazimierz-kokocinski-1916", "walenty-kokocinski-1881", "jozefa-zesko-1887", "antoni-zesko-1857"], "thumb": "img/thumb/1917-birth-kazimierz-kokocinski.jpg", "w": 1000, "h": 931}, "z1892": {"title": "Żeśkowie w Tykadłowie", "short": "1892 · Żeśkowie", "when": "Tykadłów 1892 · Brzeźnio 1916", "img": "img/1892-birth-ludwika-zesko.jpg", "cap": "Tykadłów, urodzenia 1892, akt nr 20 (po rosyjsku)", "cite": "Archiwum Państwowe w Kaliszu, 11/764/0/1/68, skan 10 · Brzeźnio, małżeństwa 1916, akt 39, metryki.genealodzy.pl id218-sy1916-kt2", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11961702", "site": "szukajwarchiwach.gov.pl", "orig": "Антоній Жесько (Antoni Żeśko), коморникъ изъ Тыкадлова … Іосифы урожденной Шимчаковой (Józefy z Szymczaków)", "reading": "W lipcu 1892 roku Antoni Żeśko, komornik z Tykadłowa, lat 34, zgłasza córkę Ludwikę urodzoną z żony Józefy z Szymczaków, lat 30. To ci sami Antoni i Józefa, którzy są w drzewie jako rodzice Józefy Kokocińskiej.", "points": ["Ojciec chrzestny: Józef Żeśko, lat 28, zapewne brat Antoniego.", "W tej samej parafii Tykadłów w 1893 roku pobrali się Józef Kazimierczak i Antonina Dąbkowska. W latach 90. XIX wieku Kazimierczakowie i Żeśkowie mieszkali w tej samej parafii."], "extra": {"img": "img/1916-marriage-ludwika-zysko.jpg", "cap": "Brzeźnio, małżeństwa 1916, akt nr 39", "orig": "Ludwiką Żyśko, panną lat dwadzieścia cztery, urodzoną w Tykadłowie … córką żyjących Antoniego i Józefy z Szymczaków", "reading": "W 1916 roku Ludwika, lat 24, urodzona w Tykadłowie, bierze ślub w Brzeźniu. Mieszka przy rodzicach Antonim i Józefie z Szymczaków w Pustelniku. To łączy Żeśków z Tykadłowa z Żyśkami z Pustelnika.", "w": 1100, "h": 457}, "people": ["antoni-zesko-1857", "jozefa-szymczak-1858"], "thumb": "img/thumb/1892-birth-ludwika-zesko.jpg", "w": 1100, "h": 465}, "b1863": {"title": "Akt chrztu Józefa Kazimierczaka", "short": "1863 · chrzest", "when": "Borków, 4 lutego 1863", "img": "img/1863-birth-jozef-kazimierczak.jpg", "cap": "Parafia Borków, urodzenia 1863, akt nr 8", "cite": "Archiwum Państwowe w Kaliszu, 11/657/0/1/39, skan 5", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/29541489", "site": "szukajwarchiwach.gov.pl", "orig": "Stawił się Stanisław Kaźmierczak, wyrobnik lat czterdzieści pięć, w Czartkach zamieszkały … z jego małżonki Katarzyny z Kubiaków lat czterdzieści", "reading": "Stanisław Kaźmierczak, wyrobnik z Czartek, lat 45, zgłasza syna urodzonego 3 lutego 1863 roku z żony Katarzyny z Kubiaków, lat 40. Dziecku nadano imię Józef.", "points": ["Na marginesie: „Zmarł w Kaliszu dn. 1 marca 1950, USC Kalisz nr 173/50”. Ta sama adnotacja co na akcie ślubu z 1893 roku, więc to na pewno ten sam Józef.", " juskowiak-1859", "franciszek-walkowiak", "jozefa-pawlak", "michal-juskowiak", "katarzyna-plonka"], "thumb": "img/thumb/1877-marriage-walkowiak-juskowiak.jpg", "w": 900, "h": 1596}, "m1865": {"title": "Ślub Ludwika Dąbkowskiego i Agnieszki Żarneckiej", "short": "1865 · ślub", "when": "Tykadłów, 19 listopada 1865", "img": "img/1865-marriage-dabkowski.jpg", "cap": "Parafia Tykadłów, małżeństwa 1865, akt nr 6", "cite": "Archiwum Państwowe w Kaliszu, 11/764/0/1/41, skan 16", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/29726258", "site": "szukajwarchiwach.gov.pl", "orig": "pomiędzy Ludwikiem Dąbkowskim kawalerem … synem Mateusza i Elżbiety z Gnerowiczów … a Agnieszką z Kurzów Żarnecką, wdową", "reading": "Ludwik Dąbkowski, kawaler, około 20 lat, urodzony i mieszkający przy rodzicach w Tykadłowie, syn Mateusza i Elżbiety Dąbkowskich, gospodarzy, poślubia Agnieszkę, wdowę po Żarneckim, lat 30, urodzoną w Russowie, córkę zmarłych Wojciecha i Maryanny.", "points": ["To rodzice Antoniny Dąbkowskiej (ur. ok. 1871 w Russowie) i jej siostry Marianny.", "Nazwisko panieńskie Agnieszki: tu „z Kurzów”, w akcie z 1893 roku „Kurówna” (Куровной). Pisownia niepewna: Kur albo Kurz."], "people": ["antonina-dabkowska-1871", "ludwik-dabkowski-1845", "agnieszka-kurz-1835", "mateusz-dabkowski", "elzbieta-gnerowicz", "wojciech-kurz", "maryanna"], "thumb": "img/thumb/1865-marriage-dabkowski.jpg", "w": 1000, "h": 871}, "b1914": {"title": "Akt urodzenia Antoniego Rychlewicza", "short": "1914 · urodzenie", "when": "Wieszczyczyn (USC Dolsk), 1 grudnia 1914", "img": "img/1914-birth-antoni-rychlewicz.jpg", "cap": "USC Dolsk, Rejestr główny urodzeń 1914, nr 276", "cite": "Archiwum Państwowe w Poznaniu, 53/1849/0/1/251, skan 141", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/9674571", "site": "szukajwarchiwach.gov.pl", "orig": "von der Anna Rychlewicz geborenen Włodarczak, Ehefrau des Gutsgespannarbeiters Matthias Rychlewicz … zu Wieszczyczyn … am ersten Dezember … tausend neunhundert vierzehn nachmittags um drei Uhr ein Knabe … Anton", "reading": "Akuszerka Jadwiga Rubach z Dolska zgłasza 7 grudnia 1914, że Anna Rychlewicz z domu Włodarczak, żona robotnika folwarcznego Macieja Rychlewicza z Wieszczyczyna, urodziła 1 grudnia 1914 o trzeciej po południu syna, któremu nadano imię Antoni.", "points": ["Data zgadza się co do dnia z nagrobkiem w Śremie.", "Rodzeństwo według indeksu BaSIA: Marianna 1908 i Jan 1910 (Mechlin, USC Śrem), Teofil 1912 (Russocin, USC Dolsk)."], "people": ["antoni-rychlewicz-1914", "maciej-rychlewicz-1880", "anna-wlodarczak-1886"], "thumb": "img/thumb/1914-birth-antoni-rychlewicz.jpg", "w": 900, "h": 1181}, "m1904": {"title": "Ślub Macieja Rychlewicza i Anny Włodarczak", "short": "1904 · ślub", "when": "Śrem, 29 kwietnia 1904", "img": "img/1904-marriage-rychlewicz-wlodarczak.jpg", "cap": "USC Śrem, małżeństwa 1904, nr 20", "cite": "Archiwum Państwowe w Poznaniu, 53/1963/0/2/221, skan 42 · urodzenie Anny: USC Śrem 1886 nr 319", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/1414164", "site": "szukajwarchiwach.gov.pl", "orig": "der Bergmann Mathias (Maciej) Rychlewicz … geboren am siebenzehnten Februar … achtzig zu Tulce … Sohn des Arbeiters Valentin Rychlewicz zu Rogalin und dessen verstorbenen Ehefrau Victoria geborenen Wojtkowiak … Tochter des zu Mechlin verstorbenen Wirts Roch Włodarczak und dessen Ehefrau Marianna geborenen Cikowiak", "reading": "Górnik Maciej Rychlewicz, ur. 17 lutego 1880 w Tulcach, mieszkający w Osterfeld (Zagłębie Ruhry), syn robotnika Walentego Rychlewicza z Rogalina i zmarłej Wiktorii z Wojtkowiaków, poślubia Annę Włodarczak, ur. w lipcu 1886 w Mechlinie, córkę zmarłego gospodarza Rocha Włodarczaka i Marianny z Cikowiaków.", "points": ["Pieczątka na marginesie: żona zmarła 13 lipca 1958 w Mechlinie (USC Mechlin 4/1958).", "Akt urodzenia Anny (USC Śrem 1886, nr 319) podaje tych samych rodziców i datę 16 lipca 1886; akt ślubu mówi 18 lipca.", "Walenty i Wiktoria wzięli ślub w parafii Tulce 26 października 1873 roku (akt 15, odczytany ze skanu)."], "people": ["maciej-rychlewicz-1880", "anna-wlodarczak-1886", "walenty-rychlewicz-1848", "wiktoria-wojtkowiak-1853", "roch-wlodarczak-1849", "marianna-cikowiak-1854"], "thumb": "img/thumb/1904-marriage-rychlewicz-wlodarczak.jpg", "w": 900, "h": 1313}, "m1908": {"title": "Ślub Walentego Kokocińskiego i Józefy Żeśko", "short": "1908 · ślub", "when": "Tykadłów, 16 lutego 1908", "img": "img/1908-marriage-kokocinski-zesko.jpg", "cap": "Parafia Tykadłów, małżeństwa 1908, akt nr 12 (po rosyjsku)", "cite": "Archiwum Państwowe w Kaliszu, 11/764/0/1/84, skan 28 · urodzenie Walentego: Tykadłów 1881, akt 3", "url": "https://www.szukajwarchiwach.gov.pl/jednostka/-/jednostka/11961718", "site": "szukajwarchiwach.gov.pl", "orig": "Валентомъ Кокоцинскимъ (Walentym Kokocińskim) … сыномъ Кацпра Кокоцинскаго и жены его Михалины урожденной Шляковска … Юзефою Жесько (Józefą Żeśko) … дочерью Антонія Жесько и жены его Юзефы урожденной Шимчакъ", "reading": "Walenty Kokociński, kawaler, lat 27, urodzony i mieszkający przy rodzicach w Tykadłowie, syn Kacpra i Michaliny ze Szlakowskich, poślubia Józefę Żeśko, pannę, lat 21, urodzoną i mieszkającą przy rodzicach w Tykadłowie, córkę Antoniego Żeśki i Józefy z Szymczaków.", "points": ["Walenty urodził się w Tykadłowie 13 lutego 1881 (akt 3/1881), syn Kacpra, służącego, lat 27, i Michaliny, lat 24.", "Na marginesie: żona zmarła 10 grudnia 1980 (USC nr 57/80), tak samo jak na jej akcie urodzenia.", "Między 1908 a 1916 rokiem rodzina przeniosła się z Tykadłowa do Pustelnika pod Sieradzem."], "people": ["walenty-kokocinski-1881", "jozefa-zesko-1887", "kacper-kokocinski-1852", "michalina-szlakowska-1856"], "thumb": "img/thumb/1908-marriage-kokocinski-zesko.jpg", "w": 900, "h": 921}}, "graves": [{"plot": "Cmentarz przykościelny, ul. Ogrodowa", "people": [["Kazimierz Dworczyński", "1910-1987", "kazimierz-dworczynski-1910"], ["Władysława Dworczyńska", "1919-1994", "wladyslawa-klaczyk-1919"], ["Franciszka Szylderowicz", "1893-1977", "franciszka-zydorczak-1893"], ["Tadeusz Szylderowicz", "1901-1983", "tadeusz-szylderowicz-1901"]], "note": "Rok urodzenia Kazimierza zgadza się z aktem z 1910 roku. Franciszka była matką Władysławy, a Tadeusz (ur. w Śremie w 1901) jej ojczymem (babcia Elżbieta).", "url": "https://billiongraves.com/grave/Kazimierz-Dworczy%C5%84ski/29912233"}, {"plot": "Cmentarz parafialny", "people": [["Kazimierz Kokociński", "1916-2011", "kazimierz-kokocinski-1916"], ["Anna Kokocińska", "1919-2007", "anna-cenker-1919"], ["Roman Szafrański", "1946-2015", "roman-szafranski-1946"]], "note": "Roman to zięć Kazimierza i Anny; jego żona Danuta, ich córka, żyje. Kazimierz urodził się w 1916 roku, więc jego akt urodzenia jest już jawny.", "url": "https://billiongraves.com/grave/Kazimierz-Kokocinski/25123105"}, {"plot": "Cmentarz komunalny", "people": [["Antoni Rychlewicz", "1 XII 1914 - 5 V 1987", "antoni-rychlewicz-1914"], ["Maria Rychlewicz", "1921-2012", "maria-porebska-1921"], ["Zbigniew Kubiak", "1947-2001", "zbigniew-kubiak-1947"], ["Karolina Porębska", "", "karolina-porebska"]], "note": "Ich córka Krystyna wyszła za Kubiaka. Karolina Porębska to niezamężna siostra Marii (według rodziny).", "url": "https://billiongraves.com/grave/Antoni-Rychlewicz/17260530"}, {"plot": "Cmentarz komunalny", "people": [["Stefan Kaźmierczak", "1911-2003", "stefan-kazimierczak-1911"], ["Wanda Kaźmierczak", "1920-1987", "wanda-adamska-1920"]], "note": "Zgadza się z drzewem. Akt chrztu Stefana z 1911 roku to akt z Dobrzeca powyżej.", "url": "https://billiongraves.com/grave/Stefan-Ka%C5%BAmierczak/18836430"}], "stories": [{"slug": "tykadlow-pustelnik", "title": "Z Tykadłowa do Pustelnika", "lead": "Kokocińscy i Żeśkowie: komornicy i słudzy dworscy spod Kalisza, potem gospodarze pod Sieradzem.", "paras": ["Tykadłów leży kilkanaście kilometrów na północny wschód od Kalisza. W XIX wieku była to wieś w Królestwie Polskim, pod władzą Rosji, dlatego od 1868 roku akty spisywano tam po rosyjsku. Nazwisko jednej z rodzin zapisywano raz jako Rześko, raz Żeśko, a później Żyśko. To jedna rodzina.", "W 1852 roku w Tykadłowie wzięli ślub <a href=\"#/osoba/wawrzyniec-zesko-1829\">Wawrzyniec Rześko<\/a>, parobek, syn <a href=\"#/osoba/joachim-rzesko\">Joachima<\/a>, i <a href=\"#/osoba/rozalia-chrzanowska-1832\">Rozalia Chrzanowska<\/a>. Ich syn <a href=\"#/osoba/antoni-zesko-1857\">Antoni<\/a> urodził się w 1857 roku, a w 1879 ożenił się z <a href=\"#/osoba/jozefa-szymczak-1858\">Józefą Szymczak<\/a>, córką komornika. W 1887 roku urodziła im się córka <a href=\"#/osoba/jozefa-zesko-1887\">Józefa<\/a>.", "W tej samej wsi mieszkał <a href=\"#/osoba/kacper-kokocinski-1852\">Kacper Kokociński<\/a>, furman i sługa dworski, z żoną <a href=\"#/osoba/michalina-szlakowska-1856\">Michaliną ze Szlakowskich<\/a> z Długiej Wsi pod Stawiszynem. Ich syn <a href=\"#/osoba/walenty-kokocinski-1881\">Walenty<\/a> urodził się w 1881 roku. 16 lutego 1908 roku Walenty i Józefa Żeśko wzięli ślub w Tykadłowie. Tam urodziły się ich pierwsze dzieci: <a href=\"#/osoba/stefan-kokocinski-1908\">Stefan<\/a> (1908) i <a href=\"#/osoba/stanislawa-kokocinska-1910\">Stanisława<\/a> (1910).", "Między 1910 a 1913 rokiem rodzina przeniosła się do Pustelnika w parafii Brzeźnio pod Sieradzem. Tam w 1913 roku urodził się <a href=\"#/osoba/jozef-kokocinski-1913\">Józef<\/a>, a 28 grudnia 1916 roku <a href=\"#/osoba/kazimierz-kokocinski-1916\">Kazimierz<\/a>. Na akcie chrztu Kazimierza świadkiem był dziadek, Antoni Żyśko, „gospodarz z Pustelnika, lat 56”. W tym samym kościele w 1916 roku wzięła ślub siostra Józefy, <a href=\"#/osoba/ludwika-zesko-1892\">Ludwika<\/a>.", "Walenty zmarł w 1958 roku, a Józefa w 1980 roku. Dopiski na ich aktach podają w obu przypadkach Tykadłów; drzewo w MyHeritage podawało Jaszkowo pod Śremem. Kazimierz zmarł w Śremie w 2011 roku. Kiedy i dlaczego rodzina przeniosła się z okolic Sieradza pod Śrem, nie wiemy: to pytanie do rodziny."]}, {"slug": "warnitz-lubeka", "title": "Warnitz i ślub w Lubece 1945", "lead": "Antoni Rychlewicz i Maria Porębska: Wielkopolska, Sądecczyzna i roboty przymusowe w Meklemburgii.", "paras": ["<a href=\"#/osoba/antoni-rychlewicz-1914\">Antoni Rychlewicz<\/a> urodził się 1 grudnia 1914 roku w Wieszczyczynie pod Dolskiem, jako syn robotnika folwarcznego <a href=\"#/osoba/maciej-rychlewicz-1880\">Macieja<\/a> i <a href=\"#/osoba/anna-wlodarczak-1886\">Anny z Włodarczaków<\/a>. Jego ojciec znał już pracę na obczyźnie: w 1904 roku, w chwili ślubu, był górnikiem w Osterfeld w Zagłębiu Ruhry.", "<a href=\"#/osoba/maria-porebska-1921\">Maria Porębska<\/a> urodziła się 19 marca 1921 roku w Podegrodziu koło Nowego Sącza, w dawnej Galicji, i następnego dnia została ochrzczona. Jej rodzice, <a href=\"#/osoba/stanislaw-porebski-1891\">Stanisław Porębski<\/a>, zagrodnik z sąsiedniej Gostwicy, i <a href=\"#/osoba/ludwika-nowinska-1896\">Ludwika z Nowińskich<\/a>, wzięli ślub w Podegrodziu 13 listopada 1919 roku. Ludwika była wtedy niepełnoletnia, więc zgodę na ślub wydał sąd opiekuńczy w Starym Sączu. Mieszkali w domu nr 127, w którym w 1924 roku urodziła się młodsza siostra Marii, <a href=\"#/osoba/karolina-porebska\">Karolina<\/a>.", "W czasie wojny oboje trafili na roboty przymusowe do gospodarstwa w Warnitz w Meklemburgii (według rodziny). Po wojnie, 11 czerwca 1945 roku, wzięli ślub cywilny w urzędzie stanu cywilnego Lübeck I. Mieszkali wtedy w Lubece przy ulicy Bei der Lohmühle. W akcie zapisano: „Mann: Pole, Frau: Polin”. Odpis tego aktu przechowuje Arolsen Archives.", "Antoni zmarł w 1987 roku, Maria w 2012 roku. Leżą razem na cmentarzu komunalnym w Śremie, w jednym grobie z niezamężną siostrą Marii, <a href=\"#/osoba/karolina-porebska\">Karoliną Porębską<\/a>. Księgi parafii Podegrodzie są dostępne w Skanotece Polskiego Towarzystwa Genealogicznego; dalsze pokolenia, Porębskich z Gostwicy i Nowińskich z Podegrodzia, można tam jeszcze odczytać."]}, {"slug": "kepno", "title": "Kępno: Wanda Sabina i rodzina Hojków", "lead": "Jak rodzinne „Sojka albo Chojka” okazało się Hojką z Olszowej.", "paras": ["<a href=\"#/osoba/julian-adamski-1896\">Julian Adamski<\/a> urodził się 21 marca 1896 roku w Kępnie, w rodzinie <a href=\"#/osoba/jozef-adamski\">Józefa Adamskiego<\/a>, robotnika, później właściciela domu, i <a href=\"#/osoba/maria-grabska\">Marii z Grabskich<\/a>. Był cieślą. Kępno należało wtedy do zaboru pruskiego i wróciło do Polski dopiero w 1920 roku.", "<a href=\"#/osoba/helena-hojka-1899\">Helena Hojka<\/a> urodziła się 14 maja 1899 roku w Olszowej pod Kępnem, jako córka gospodarza <a href=\"#/osoba/piotr-hojka\">Piotra Hojki<\/a> i <a href=\"#/osoba/franciszka-sobotta\">Franciszki z Sobottów<\/a>. W rodzinie zapamiętano jej nazwisko jako „Sojka albo Chojka”. Akty mówią jasno: Hojka. Miała starszego brata <a href=\"#/osoba/hipolit-hojka-1887\">Hipolita<\/a>.", "Julian i Helena wzięli ślub w Kępnie 15 listopada 1919 roku. Rok później, 4 listopada 1920 roku, urodziła się ich córka <a href=\"#/osoba/wanda-adamska-1920\">Wanda Sabina<\/a>. Na jej akcie urodzenia jest ciekawy dopisek z 9 stycznia 1941 roku: imię ojca poprawiono z „Jan” na „Julian”. Cztery dni wcześniej Wanda wzięła ślub w Warszawie ze <a href=\"#/osoba/stefan-kazimierczak-1911\">Stefanem Kazimierczakiem<\/a> (według rodziny). Wanda miała młodszą siostrę <a href=\"#/osoba/halina-adamska-1922\">Halinę<\/a>.", "Rodzina mieszkała w Kępnie, a około 1949 roku przeniosła się do Śremu. Tam zmarli Julian (1969) i Helena (prawdopodobnie 1971), a także Wanda (1987)."]}, {"slug": "mechlin", "title": "Mechlin: Włodarczakowie i Rychlewiczowie", "lead": "Wieś pod Śremem, do której wracały kolejne pokolenia.", "paras": ["<a href=\"#/osoba/roch-wlodarczak-1849\">Roch Włodarczak<\/a> urodził się około 1849 roku w Gawronach, jako syn <a href=\"#/osoba/roch-wlodarczak\">Rocha<\/a>. Był gospodarzem w Mechlinie. Jego żona, <a href=\"#/osoba/marianna-cikowiak-1854\">Marianna z Cikowiaków<\/a>, była córką mechlińskiego gospodarza <a href=\"#/osoba/melchior-cykowiak\">Melchiora Cykowiaka<\/a>. Ślub wzięli w parafii Śrem w 1873 roku (według indeksu).", "Roch zmarł w Mechlinie 9 czerwca 1888 roku, w wieku 39 lat. Ich córka <a href=\"#/osoba/anna-wlodarczak-1886\">Anna<\/a> nie miała wtedy jeszcze dwóch lat. Jeszcze w tym samym roku Marianna wyszła drugi raz za mąż, za <a href=\"#/osoba/ignacy-mieloch\">Ignacego Mielocha<\/a> z Mechlina. Brat Anny, <a href=\"#/osoba/franciszek-wlodarczak-1883\">Franciszek<\/a>, ożenił się w Śremie w 1911 roku.", "29 kwietnia 1904 roku Anna wzięła ślub w Śremie z <a href=\"#/osoba/maciej-rychlewicz-1880\">Maciejem Rychlewiczem<\/a>, górnikiem z Zagłębia Ruhry, urodzonym w Tulcach pod Poznaniem. Jego matka, <a href=\"#/osoba/wiktoria-wojtkowiak-1853\">Wiktoria z Wojtkowiaków<\/a>, zmarła w Wirach w 1885 roku, mając 32 lata. Ojciec, <a href=\"#/osoba/walenty-rychlewicz-1848\">Walenty<\/a>, ożenił się ponownie z <a href=\"#/osoba/jadwiga-naskret-1857\">Jadwigą Naskręt<\/a> i w 1910 roku mieszkał już w Mechlinie.", "Według indeksu pierwsze dzieci Macieja i Anny urodziły się w Mechlinie: <a href=\"#/osoba/marianna-rychlewicz-1908\">Marianna<\/a> (1908) i <a href=\"#/osoba/jan-rychlewicz-1910\">Jan<\/a> (1910). Według indeksu <a href=\"#/osoba/teofil-rychlewicz-1912\">Teofil<\/a> urodził się w Russocinie (1912). <a href=\"#/osoba/antoni-rychlewicz-1914\">Antoni<\/a> przyszedł na świat w Wieszczyczynie (1914), gdzie Maciej był wtedy robotnikiem folwarcznym. Anna zmarła w Mechlinie w 1958 roku.", "Ciekawostka z aktu zgonu z 1880 roku: <a href=\"#/osoba/mateusz-wojtkowiak-1813\">Mateusz Wojtkowiak<\/a>, ojciec Wiktorii, był synem <a href=\"#/osoba/bartlomiej-rychlewicz\">Bartłomieja Rychlewicza<\/a>. Urodził się więc jako Rychlewicz. Czy Walenty i Wiktoria byli spokrewnieni, nie wiadomo."]}, {"slug": "dworczynscy", "title": "Dworczyńscy wokół Śremu", "lead": "Cztery pokolenia w promieniu kilkunastu kilometrów od Śremu.", "paras": ["<a href=\"#/osoba/jan-dworczynski-1844\">Jan Dworczyński<\/a> i <a href=\"#/osoba/marianna-lagoda-1843\">Marianna Łagoda<\/a> wzięli ślub w parafii Dolsk w 1869 roku (według indeksu). Jan był chałupnikiem w Drzonku. Tam 22 października 1878 roku urodził się ich syn <a href=\"#/osoba/franciszek-dworczynski-1878\">Franciszek<\/a>.", "<a href=\"#/osoba/katarzyna-walkowiak-1882\">Katarzyna Walkowiak<\/a> urodziła się 17 października 1882 roku w Pokrzywnicy. Jej ojciec, <a href=\"#/osoba/andrzej-walkowiak-1853\">Andrzej<\/a>, był owczarzem, urodzonym w Jaworach; matka, <a href=\"#/osoba/marianna-juskowiak-1859\">Marianna z Juskowiaków<\/a>, pochodziła z Wziąchowa. Pobrali się w Borku w 1877 roku.", "Franciszek, robotnik, i Katarzyna wzięli ślub w Międzychodzie pod Dolskiem 18 października 1901 roku. Według indeksów urodziły im się dzieci: <a href=\"#/osoba/marianna-dworczynska-1903\">Marianna<\/a> (1903), <a href=\"#/osoba/pelagia-dworczynska-1905\">Pelagia<\/a> (1905), <a href=\"#/osoba/stanislaw-dworczynski-1909\">Stanisław<\/a> (1909) i <a href=\"#/osoba/kazimierz-dworczynski-1910\">Kazimierz<\/a>, urodzony 17 grudnia 1910 roku w Międzychodzie.", "Na marginesie aktu urodzenia Kazimierza jest późniejsza niemiecka pieczątka: ślub zawarty 19 kwietnia 1941 roku w Śremie (akt 44/1941). Żoną Kazimierza była <a href=\"#/osoba/wladyslawa-klaczyk-1919\">Władysława z Klaczyków<\/a> z rodziny osiadłej w Nochowie (według rodziny). Jej rodzicami byli prawdopodobnie <a href=\"#/osoba/teodor-klaczyk-1876\">Teodor Klaczyk<\/a>, robotnik z Mechlina urodzony w pobliskim Zbrudzewie, i <a href=\"#/osoba/franciszka-zydorczak-1893\">Franciszka z Zydorczaków<\/a> z Kępy Małej, którzy według indeksu wzięli ślub w Zaniemyślu w 1913 roku. 25 lutego 1942 roku urodził się ich syn <a href=\"#/osoba/wojciech-dworczynski-1942\">Wojciech<\/a>.", "Kazimierz zmarł w 1987 roku, Władysława w 1994 roku. Leżą na cmentarzu przy ul. Ogrodowej w Śremie, w jednym grobie z matką Władysławy, <a href=\"#/osoba/franciszka-zydorczak-1893\">Franciszką<\/a>, i jej drugim mężem, <a href=\"#/osoba/tadeusz-szylderowicz-1901\">Tadeuszem Szylderowiczem<\/a>."]}, {"slug": "kazimierczakowie", "title": "Kazimierczakowie spod Kalisza", "lead": "Od wyrobnika z Czartek do Dobrzeca, Warszawy i Śremu.", "paras": ["<a href=\"#/osoba/stanislaw-kazimierczak-1819\">Stanisław Kaźmierczak<\/a> urodził się około 1819 roku w Złotnikach, a jako wyrobnik mieszkał w Czartkach w parafii Borków. Z żoną <a href=\"#/osoba/katarzyna-kubiak-1823\">Katarzyną z Kubiaków<\/a> miał syna <a href=\"#/osoba/jozef-kazimierczak-1863\">Józefa<\/a>, urodzonego 3 lutego 1863 roku.", "Józef ożenił się po raz pierwszy w 1886 roku z <a href=\"#/osoba/katarzyna-mikolajczyk-1868\">Katarzyną Mikołajczyk<\/a>. Ich córka <a href=\"#/osoba/jozefa-kazimierczak-1888\">Józefa<\/a> urodziła się w 1888 roku. Katarzyna zmarła w 1892 roku, mając 24 lata.", "22 stycznia 1893 roku w Tykadłowie Józef, wdowiec, poślubił <a href=\"#/osoba/antonina-dabkowska-1871\">Antoninę Dąbkowską<\/a>, służącą z Russowa, córkę komorników <a href=\"#/osoba/ludwik-dabkowski-1845\">Ludwika<\/a> i <a href=\"#/osoba/agnieszka-kurz-1835\">Agnieszki<\/a>. W drzewie rodzinnym zapisano ją jako „Dąbską”; akty mówią zgodnie: Dąbkowska. Tego samego dnia w tym samym kościele ślub wzięła jej siostra <a href=\"#/osoba/marianna-dabkowska-1869\">Marianna<\/a>.", "Starsze dzieci Józefa i Antoniny (<a href=\"#/osoba/jan-kazimierczak-1896\">Jan<\/a>, <a href=\"#/osoba/jozef-kazimierczak-1898\">Józef<\/a>, <a href=\"#/osoba/helena-kazimierczak-1900\">Helena<\/a>, <a href=\"#/osoba/piotr-kazimierczak-1902\">Piotr<\/a>) urodziły się nie wiadomo gdzie: nie ma ich w księgach Borkowa, Tykadłowa ani Dobrzeca. Młodsze przyszły na świat w parafii Dobrzec pod Kaliszem, wśród nich <a href=\"#/osoba/stefan-kazimierczak-1911\">Stefan<\/a>, 28 sierpnia 1911 roku.", "Józef zmarł w Kaliszu 1 marca 1950 roku. Stefan po ślubie z Wandą Adamską w 1941 roku mieszkał w Kępnie, a od około 1949 roku w Śremie, gdzie zmarł w 2003 roku."]}, {"slug": "ciekawostki", "title": "Trzy zabory, trzy spotkania", "lead": "Ciekawostki i mniej wesołe fakty z drzewa: co wyszło z aktów.", "paras": ["Ośmioro pradziadków Huberta urodziło się w trzech zaborach. Śrem, Dolsk i Kępno były w zaborze pruskim, a akty pisano tam po niemiecku. Kalisz, Tykadłów i Brzeźnio leżały w Królestwie Polskim, gdzie akty spisywano cyrylicą. Podegrodzie pod Nowym Sączem należało do Galicji, a księgi parafialne prowadzono po łacinie. Wszyscy ośmioro spoczywają w Śremie.", "Rodziny ze strony ojca i matki zetknęły się na długo przed spotkaniem rodziców, i to trzy razy. W Tykadłowie wzięła ślub w 1893 roku <a href=\"#/osoba/antonina-dabkowska-1871\">Antonina Dąbkowska<\/a>, a jej ojciec <a href=\"#/osoba/ludwik-dabkowski-1845\">Ludwik<\/a> stamtąd pochodził. W tej samej parafii, w tych samych latach, mieszkali <a href=\"#/osoba/kacper-kokocinski-1852\">Kokocińscy<\/a>, <a href=\"#/osoba/antoni-zesko-1857\">Żeśkowie<\/a> i <a href=\"#/osoba/jozefa-szymczak-1858\">Szymczakowie<\/a>. Pierwszym mężem <a href=\"#/osoba/agnieszka-kurz-1835\">Agnieszki<\/a>, matki Antoniny, był Żarnecki, z tej samej rodziny co <a href=\"#/osoba/elzbieta-zarnecka-1827\">Elżbieta Żarnecka<\/a>. Pokrewieństwa nie udowodniono.", "Drugie miejsce to Mechlin pod Śremem. <a href=\"#/osoba/franciszka-zydorczak-1893\">Franciszka z Zydorczaków<\/a> zmarła tam w 1977 roku (strona ojca, prawdopodobne), a <a href=\"#/osoba/anna-wlodarczak-1886\">Anna z Włodarczaków<\/a> urodziła się tam i zmarła w 1958 roku (strona matki). Dwie praprababcie przez dziesięciolecia w jednej małej wsi. Trzecie to parafia Ostrzeszów: stamtąd, z Siedlikowa, pochodził <a href=\"#/osoba/michal-szlakowski-1821\">Michał Szlakowski<\/a> (strona matki), a z Olszyny w tej samej parafii <a href=\"#/osoba/andrzej-adamski\">Adamscy<\/a> (strona ojca).", "W linii Rychlewiczów jest pętla. <a href=\"#/osoba/mateusz-wojtkowiak-1813\">Mateusz Wojtkowiak<\/a> według własnego aktu zgonu był synem <a href=\"#/osoba/bartlomiej-rychlewicz\">Bartłomieja Rychlewicza<\/a>, a jego córka <a href=\"#/osoba/wiktoria-wojtkowiak-1853\">Wiktoria<\/a> wyszła za <a href=\"#/osoba/walenty-rychlewicz-1848\">Walentego Rychlewicza<\/a>. Mogło to być małżeństwo krewnych; nie jest to udowodnione.", "<a href=\"#/osoba/stanislaw-porebski-1891\">Stanisław Porębski<\/a> miał brata bliźniaka, <a href=\"#/osoba/pawel-porebski-1891\">Pawła<\/a>. Paweł ożenił się 12 listopada 1919 roku (według indeksu), Stanisław dzień później. W 1911 roku urzędnik w Dobrzecu zapisał <a href=\"#/osoba/stefan-kazimierczak-1911\">Stefana Kazimierczaka<\/a> jako „dziecię płci żeńskiej”; imię i dalszy tekst nie pozostawiają wątpliwości. Rodzinna pamięć też myliła tropy: „Dąbska” to Dąbkowska, „Sojka albo Chojka” to Hojka, a Szylderowicz okazał się nazwiskiem ojczyma.", "Najstarszy znany przodek to <a href=\"#/osoba/michal-szlakowski\">Michał Szlakowski<\/a>, 53-letni wdowiec, który ożenił się ponownie w 1812 roku, więc urodził się około 1759 roku (według indeksu). Pokolenie pradziadków żyło długo: <a href=\"#/osoba/kazimierz-kokocinski-1916\">Kazimierz Kokociński<\/a> dożył 94 lat, Stefan Kazimierczak 92, <a href=\"#/osoba/maria-porebska-1921\">Maria Porębska<\/a> 91. <a href=\"#/osoba/katarzyna-kubiak-1823\">Katarzyna Kubiak<\/a>, urodzona około 1823 roku, żyła do 1912.", "Wcześniej bywało ciężej. <a href=\"#/osoba/roch-wlodarczak-1849\">Roch i Marianna Włodarczakowie<\/a> stracili między 1878 a 1882 rokiem czworo dzieci, w tym dwoje martwo urodzonych; Roch zmarł w wieku 39 lat. <a href=\"#/osoba/wiktoria-wojtkowiak-1853\">Wiktoria Wojtkowiak<\/a> zmarła w 1885 roku, mając 32 lata, w roku narodzin i śmierci syna Marcina. <a href=\"#/osoba/antoni-nowinski\">Antoni Nowiński<\/a>, kościelny w Podegrodziu, zmarł na raka w wieku 43 lat, gdy jego córka <a href=\"#/osoba/ludwika-nowinska-1896\">Ludwika<\/a> miała 5 miesięcy. <a href=\"#/osoba/szymon-kokocinski-1815\">Szymon Kokociński<\/a> zmarł 30 września 1857 roku, miesiąc po swojej sześcioletniej córce.", "<a href=\"#/osoba/jozef-kazimierczak-1863\">Józef Kazimierczak<\/a> owdowiał w wieku 28 lat, a jego córka <a href=\"#/osoba/jozefa-kazimierczak-1888\">Józefa<\/a> wyszła za mąż, mając 16 lat i 10 miesięcy, za 30-letniego wdowca. <a href=\"#/osoba/jozef-porebski\">Józef Porębski<\/a>, 38-letni wdowiec, poślubił 17-letnią Annę Piętkę. Szlachty w drzewie nie ma: są komornicy, parobkowie, owczarz, furman, stróż i słudzy dworscy. Wiele praprapraprababć znamy tylko z imienia, a w akcie zgonu Rocha Włodarczaka z 1888 roku matka jest „nieznana”.", "Otwarte pytanie: czy sąsiedztwo w Tykadłowie, Mechlinie albo Ostrzeszowie dało kiedyś wspólnego przodka obu stron rodziny. Akty tego jeszcze nie rozstrzygają."]}]}; window.__GEO__ = {"places": {"Białystok": [53.1322, 23.1686], "Borek": [51.9164, 17.2422], "Borków": [51.8286, 18.1256], "Brzeźnio": [51.4947, 18.6228], "Chocz": [51.9752, 17.8707], "Czartki": [51.835, 18.1542], "Dobrzec": [51.7536, 18.0356], "Dolsk": [51.9867, 17.0661], "Drzonek": [52.0314, 17.0564], "Długa Wieś": [51.92, 18.088], "Gawrony": [52.0397, 17.0333], "Godziątków": [51.9168, 18.0497], "Gorzów Wielkopolski": [52.7308, 15.2383], "Gostwica": [49.5955, 20.5916], "Głoginin": [51.8711, 17.3053], "Jaszkowo": [52.1419, 16.9744], "Jawory": [51.9442, 17.1817], "Kalisz": [51.7608, 18.0869], "Książ": [52.0624, 17.2396], "Kępa Mała": [52.1123, 17.1905], "Kępno": [51.2792, 17.9833], "Lubeka": [53.8667, 10.6833], "Mechlin": [52.1106, 17.0742], "Międzychód": [52.0264, 17.0297], "Ogrody (Kalisz)": [51.7631, 18.0708], "Olszowa": [51.2955, 18.0478], "Olszowa (pow. kępiński)": [51.2955, 18.0478], "Olszyna": [51.4095, 17.9113], "Osterfeld": [51.5, 6.8878], "Ostrowo (gm. Śrem)": [52.0456, 17.0389], "Ostrzeszów": [51.4258, 17.9332], "Piątek Wielki": [51.8971, 18.0818], "Podegrodzie": [49.5761, 20.589], "Pokrzywnica": [51.9625, 17.1072], "Pustelnik": [51.5117, 18.6211], "Rogalin": [52.235, 16.9389], "Rogalinek":   L.polygon(ll([...B_PR_AT.slice().reverse(), ...B_RU_AT.slice(1), [25, 50.8], [25, 45], [16, 45]]), { stroke: false, className: "zab-fill-at", interactive: false }),
  ...[B_PR_RU, B_RU_AT, B_PR_AT].map(b => L.polyline(ll(b), { className: "zab-line", weight: 2, opacity: 0.7, dashArray: "2 6", lineCap: "round", interactive: false })),
  ...[["zabór pruski", 52.36, 16.75], ["zabór rosyjski", 52.36, 18.35], ["zabór austriacki", 49.85, 20.2]].map(([t, la, lo]) =>
    L.marker([la, lo], { interactive: false, keyboard: false, icon: L.divIcon({ className: "zab-label", html: t, iconSize: [140, 16], iconAnchor: [70, 8] }) }))
]);
let zabOn = null;

// ---------- overlay: dots, place labels, trails, the selected person's path, off-screen hints
const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const ov = svgEl("svg", { class: "ov", "aria-hidden": "true" });
map.getContainer().appendChild(ov);
const gTrail = svgEl("g", { class: "trails" }, ov), gPath = svgEl("g", { class: "selpath" }, ov), gLab = svgEl("g", { class: "plabels" }, ov), gDots = svgEl("g", { class: "dots" }, ov);
const trailPath = { o: svgEl("path", { class: "trail s-o" }, gTrail), m: svgEl("path", { class: "trail s-m" }, gTrail), x: svgEl("path", { class: "trail s-x" }, gTrail) };
const hints = $("#hints");
const dotEl = {}, labEl = {};
const ORDER = IDS.slice().sort((a, b) => (TR[b].anc - TR[a].anc) || ((P[a].by || 9999) - (P[b].by || 9999)));
for (const id of ORDER) {
  const tr = TR[id], g = svgEl("g", { class: `pd s-${tr.s}${tr.anc ? " anc" : ""} c-${P[id].st}`, "data-id": id }, gDots);
  svgEl("circle", { class: "pulse", r: 0 }, g);
  svgEl("circle", { class: "dot", r: tr.anc ? 6.5 : 4.5 }, g);
  g.style.display = "none";
  dotEl[id] = g;
}
const GA = Math.PI * (3 - Math.sqrt(5)), SP = 8.5;
const spiral = k => k ? [SP * Math.sqrt(k) * Math.cos(k * GA), SP * Math.sqrt(k) * Math.sin(k * GA)] : [0, 0];
const px = p => map.latLngToContainerPoint(PLC[p]);
let t = 1880, playing = false, speed = 1, sel = null, showTrails = true, lastPanelKey = "", lastFrame = null;

function frame() {
  const vis = [], groups = new Map(), size = map.getSize();
  for (const id of ORDER) { const s = stateAt(id, t); if (s) { vis.push([id, s]); if (!s.to) (groups.get(s.p) || groups.set(s.p, []).get(s.p)).push(id); } }
  const pos = {};
  for (const [p, ids] of groups) { const c = px(p); ids.forEach((id, k) => { const [dx, dy] = spiral(k); pos[id] = [c.x + dx, c.y + dy]; }); }
  const shown = new Set();
  for (const [id, s] of vis) {
    if (s.to) { const a = px(s.p), b = px(s.to); pos[id] = [a.x + (b.x - a.x) * s.f, a.y + (b.y - a.y) * s.f]; }
    const g = dotEl[id], [x, y] = pos[id];
    g.style.display = "";
    g.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    g.style.opacity = s.op.toFixed(2);
    g.classList.toggle("dead", s.mode === "dead");
    g.classList.toggle("stale", s.mode === "stale");
    g.classList.toggle("moving", !!s.to);
    const ev = TR[id].st.find(e => (e.k === "ur" || e.k === "slub") && t >= e.y && t - e.y < 0.9);
    const pu = g.firstChild;
    if (ev && !REDUCED.matches) { const k = (t - ev.y) / 0.9; pu.setAttribute("r", (6 + k * 16).toFixed(1)); pu.style.opacity = (1 - k).toFixed(2); pu.setAttribute("class", "pulse k-" + ev.k); }
    else pu.setAttribute("r", 0);
    shown.add(id);
  }
  for (const id of IDS) if (!shown.has(id) && dotEl[id].style.display !== "none") dotEl[id].style.display = "none";
  // place labels, biggest groups first, skipping any that would overlap
  const boxes = [], used = new Set();
  [...groups].sort((a, b) => b[1].length - a[1].length).forEach(([p, ids]) => {
    const c = px(p), r = SP * Math.sqrt(ids.length) + 8, txt = `${short(p)} ${ids.length}`;
    const w = txt.length * 6.6 + 6, bx = [c.x - w / 2, c.y - r - 15, c.x + w / 2, c.y - r + 1];
    if (c.x < 0 || c.y < 0 || c.x > size.x || c.y > size.y || boxes.some(o => !(bx[2] < o[0] || bx[0] > o[2] || bx[3] < o[1] || bx[1] > o[3]))) return;
    boxes.push(bx); used.add(p);
    let e = labEl[p];
    if (!e) { e = labEl[p] = svgEl("text", { class: "plab", "text-anchor": "middle" }, gLab); e.appendChild(document.createTextNode("")); svgEl("tspan", { class: "n" }, e); }
    e.firstChild.nodeValue = short(p) + " "; e.lastChild.textContent = ids.length;
    e.setAttribute("x", c.x.toFixed(1)); e.setAttribute("y", (c.y - r - 3).toFixed(1));
    e.style.display = "";
    e.classList.toggle(UNS.has(p) ? "unsure" : "sure", true);
  });
  for (const p in labEl) if (!used.has(p)) labEl[p].style.display = "none";
  // trails: where each direct ancestor on the map has been so far
  const dpath = { o: "", m: "", x: "" };
  if (showTrails) for (const [id, s] of vis) {
    const tr = TR[id]; if (!tr.anc) continue;
    let prev = null;
    for (let i = 0; i <= s.i; i++) {
      const pl = tr.st[i].p; if (pl === prev) continue;
      if (prev) { const a = px(prev), b = px(pl), dx = b.x - a.x, dy = b.y - a.y, L2 = Math.hypot(dx, dy) || 1, bend = Math.min(0.16 * L2, 50);
        dpath[tr.s] += `M${a.x.toFixed(1)},${a.y.toFixed(1)}Q${((a.x + b.x) / 2 - dy / L2 * bend).toFixed(1)},${((a.y + b.y) / 2 + dx / L2 * bend).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`; }
      prev = pl;
    }
  }
  for (const k in trailPath) trailPath[k].setAttribute("d", dpath[k]);
  drawSelPath();
  drawHints(groups, size);
  // partition borders only while they existed
  const z = t >= 1815 && t < 1918.86;
  if (z !== zabOn) { zabOn = z; z ? zab.addTo(map) : zab.remove(); }
  lastFrame = { vis, groups };
  updateYear();
}

function drawSelPath() {
  gPath.replaceChildren();
  if (!sel || !TR[sel]) return;
  const st = TR[sel].st, pts = [];
  st.forEach(s => { if (!pts.length || pts[pts.length - 1].p !== s.p) pts.push({ p: s.p, y: s.y }); });
  const xy = pts.map(s => px(s.p));
  if (xy.length > 1) svgEl("path", { class: `sp s-${TR[sel].s}`, d: "M" + xy.map(q => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join("L") }, gPath);
  pts.forEach((s, i) => {
    svgEl("circle", { class: "sp-stop", cx: xy[i].x, cy: xy[i].y, r: 4 }, gPath);
    const tx = svgEl("text", { class: "sp-lab", x: xy[i].x + 8, y: xy[i].y - 8 }, gPath);
    tx.textContent = `${short(s.p)} ${Math.floor(s.y)}`;
  });
  const g = dotEl[sel];
  if (g && g.style.display !== "none") { const m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute("transform")); if (m) svgEl("circle", { class: "sel-halo", cx: m[1], cy: m[2], r: 13 }, gPath); }
}

function drawHints(groups, size) {  // places with people now that lie outside the view (or under the timeline)
  const out = [], m = 26, bottom = size.y - tlInset();
  for (const [p, ids] of groups) {
    const c = px(p);
    if (c.x >= 0 && c.y >= 0 && c.x <= size.x && c.y <= bottom) continue;
    const cx = size.x / 2, cy = bottom / 2, dx = c.x - cx, dy = c.y - cy;
    const k = Math.min((cx - m) / Math.abs(dx || 1e-6), (cy - m) / Math.abs(dy || 1e-6));
    out.push({ p, n: ids.length, x: cx + dx * k, y: cy + dy * k, a: Math.atan2(dy, dx) * 180 / Math.PI });
  }
  const placed = [];
  hints.replaceChildren(...out.sort((a, b) => b.n - a.n).filter(h => { if (placed.some(o => Math.abs(o.x - h.x) < 110 && Math.abs(o.y - h.y) < 30)) return false; placed.push(h); return true; }).map(h => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "hint-chip";
    b.style.left = h.x + "px"; b.style.top = h.y + "px";
    b.innerHTML = `<span class="arr" style="transform:rotate(${h.a.toFixed(0)}deg)" aria-hidden="true">→</span>${esc(short(h.p))} <b>${h.n}</b>`;
    b.setAttribute("aria-label", `${short(h.p)}: ${h.n} ${h.n === 1 ? "osoba" : "osób"} poza widokiem; pokaż`);
    b.addEventListener("click", () => map.flyTo(PLC[h.p], Math.max(map.getZoom(), 9), { duration: REDUCED.matches ? 0 : 0.8 }));
    return b;
  }));
}

// ---------- timeline
const slider = $("#slider"), yrOut = $("#yr"), eraOut = $("#era"), playBtn = $("#play"), speedBtn = $("#speed"), ticker = $("#ticker");
slider.min = Y0; slider.max = Y1; slider.step = 1;
function updateYear() {
  const y = Math.floor(t);
  yrOut.textContent = y; eraOut.textContent = eraOf(t);
  if (+slider.value !== y) slider.value = y;
  slider.setAttribute("aria-valuetext", `rok ${y}, ${eraOf(t)}`);
  const evs = (EVENTS[y] || []);
  const tk = `${y}:${evs.length}`;
  if (ticker.dataset.k !== tk) { ticker.dataset.k = tk; ticker.innerHTML = evs.slice(0, 4).map(e => `<li>${evLine(e)}</li>`).join("") + (evs.length > 4 ? `<li class="soft">i ${evs.length - 4} więcej</li>` : ""); ticker.hidden = !evs.length; }
  if (!sel) yearPanel();
}
function drawHist() {
  const svg = $("#hist"), W = svg.clientWidth || 600, H = 34;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const X = y => 9 + (y - Y0) / (Y1 - Y0) * (W - 18);  // the range thumb travels inside a 9px inset
  const n = {}; let mx = 1;
  for (const y in EVENTS) { n[y] = EVENTS[y].length; mx = Math.max(mx, n[y]); }
  let h = BANDS.map(([a, b]) => `<rect class="band" x="${X(a).toFixed(1)}" y="0" width="${(X(b) - X(a)).toFixed(1)}" height="${H}"/>`).join("");
  const bw = Math.max(1, (W - 18) / (Y1 - Y0) - 0.6);
  for (const y in n) h += `<rect class="bar" x="${X(+y).toFixed(1)}" y="${(H - 4 - n[y] / mx * 22).toFixed(1)}" width="${bw.toFixed(1)}" height="${(n[y] / mx * 22).toFixed(1)}"/>`;
  const step = W < 500 ? 50 : 20;
  for (let y = Math.ceil(Y0 / step) * step; y <= Y1; y += step) h += `<text class="tick" x="${X(y).toFixed(1)}" y="${H - 26}" text-anchor="middle">${y}</text>`;
  for (const [y, lab] of MARKS) h += `<line class="mark" x1="${X(y).toFixed(1)}" x2="${X(y).toFixed(1)}" y1="12" y2="${H}"><title>${lab}</title></line>`;
  svg.innerHTML = h;
}
let raf = 0, tPrev = 0;
const RATE = 2.5;  // years per second at 1×
function loop(now) {
  if (!playing) return;
  const dt = Math.min(0.1, (now - tPrev) / 1000); tPrev = now;
  t = Math.min(Y1, t + dt * RATE * speed);
  frame();
  if (t >= Y1) setPlaying(false); else raf = requestAnimationFrame(loop);
}
function setPlaying(on) {
  playing = on;
  playBtn.setAttribute("aria-label", on ? "Zatrzymaj" : "Odtwórz");
  playBtn.innerHTML = on ? '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>'
    : '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.2v11.6a.6.6 0 0 0 .9.5l9.3-5.8a.6.6 0 0 0 0-1L4.9 1.7a.6.6 0 0 0-.9.5z"/></svg>';
  if (on) { if (t >= Y1 - 0.5) t = Y0; tPrev = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); }
  else { cancelAnimationFrame(raf); t = Math.round(t * 2) / 2; frame(); }
}
playBtn.addEventListener("click", () => setPlaying(!playing));
speedBtn.addEventListener("click", () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; speedBtn.textContent = speed + "×"; speedBtn.setAttribute("aria-label", `Szybkość odtwarzania: ${speed}×`); });
slider.addEventListener("input", () => { if (playing) setPlaying(false); t = +slider.value + 0.5; frame(); });
$("#stage").addEventListener("keydown", e => {
  if (e.target.closest("input:not([type=range]), button, a")) return;
  if (e.key === " " || e.key === "k") { e.preventDefault(); setPlaying(!playing); }
});

// ---------- hover and click on dots
const tip = $("#tip");
const placeNow = id => { const s = stateAt(id, t); return s ? s : null; };
function tipFor(id, x, y) {
  const s = placeNow(id), st = s && TR[id].st[s.i];
  const where = !s ? "" : s.to ? `w drodze: ${short(s.p)} → ${short(s.to)}` : s.mode === "stale" || s.mode === "dead" ? `ostatnio w aktach: ${short(st.p)}, ${Math.floor(st.y)}` : `${short(st.p)}, od ${Math.floor(st.y)} (${KINDN[st.k]})`;
  tip.innerHTML = `<b>${esc(full(id))}</b> <span>${esc(yrs(id))}</span>${where ? `<br><span>${esc(where)}</span>` : ""}${relLine(id) ? `<br><span>${esc(relLine(id))}</span>` : ""}`;
  tip.hidden = false;
  const st0 = $("#stage").getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(6, Math.min(st0.width - w - 6, x - w / 2)) + "px";
  tip.style.top = (y - h - 14 < 6 ? y + 18 : y - h - 14) + "px";
}
gDots.addEventListener("pointermove", e => { const g = e.target.closest(".pd"); if (!g) return; const r = $("#stage").getBoundingClientRect(); tipFor(g.dataset.id, e.clientX - r.left, e.clientY - r.top); });
gDots.addEventListener("pointerleave", () => { tip.hidden = true; });
gDots.addEventListener("click", e => { const g = e.target.closest(".pd"); if (g) { tip.hidden = true; go(g.dataset.id); } });
const go = id => { location.hash = "#/osoba/" + encodeURIComponent(id); };

// ---------- panel: the year when nobody is selected, otherwise the person
function yearPanel() {
  const y = Math.floor(t), lf = lastFrame;
  if (!lf) return;
  const key = `${y}|${[...lf.groups].map(([p, ids]) => p + ids.length).join(",")}`;
  if (key === lastPanelKey) return;
  lastPanelKey = key;
  $("#p-name").textContent = `Rok ${y}`;
  $("#p-sub").textContent = eraOf(t);
  const n = lf.vis.length, evs = EVENTS[y] || [];
  const places = [...lf.groups].sort((a, b) => b[1].length - a[1].length).map(([p, ids]) =>
    `<h3>${esc(short(p))} <span class="cnt">${ids.length}</span></h3><ul class="plinks">${ids.map(id => pbtn(id, SIDE_N[TR[id].s])).join("")}</ul>`).join("");
  const moving = lf.vis.filter(([, s]) => s.to).map(([id, s]) => `<li>${esc(full(id))}: ${esc(short(s.p))} → ${esc(short(s.to))}</li>`).join("");
  $("#panel-body").innerHTML = `<p class="lede-map">Na mapie: <b>${n}</b> ${n === 1 ? "osoba" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "osoby" : "osób"} z drzewa, w miejscach, które podają akty. Kliknij kropkę albo imię, żeby przeczytać o osobie.</p>
    ${legendHTML()}
    ${evs.length ? `<h3>W ${y} roku</h3><ul class="evs">${evs.map(e => `<li>${evLine(e)}</li>`).join("")}</ul>` : ""}
    ${moving ? `<h3>W drodze</h3><ul class="evs">${moving}</ul>` : ""}
    ${places}`;
}
function legendHTML() {
  return `<ul class="mlegend">
    <li><span class="lg s-o"></span>strona ojca</li><li><span class="lg s-m"></span>strona matki</li><li><span class="lg s-x"></span>przez małżeństwo</li>
    <li><span class="lg s-o anc"></span>przodek w linii prostej (większa kropka)</li>
    <li><span class="lg s-o hollow"></span>prawdopodobnie lub według rodziny</li>
    <li><span class="lg s-o faded"></span>dawno bez wzmianki w aktach</li></ul>
    <p class="soft small">Osoba stoi tam, gdzie ostatnio wspomina ją akt: urodzenie, ślub, urodzenie dziecka, inna wzmianka, śmierć. Przeprowadzkę pokazujemy tuż przed kolejnym aktem, bo jej dokładnej daty nie znamy. Osoby żyjące pominięto. Granice zaborów są orientacyjne.</p>`;
}
function personPanel(id) {
  const x = panelParts(id), tr = TR[id];
  panelHead(id);
  const stops = tr ? tr.st.map((s, i) => `<li><button type="button" class="stop" data-i="${i}"><span class="y">${Math.floor(s.y)}</span><span class="pl">${esc(short(s.p))}</span><span class="k">${esc(KINDN[s.k])}${s.r && P[s.r] ? ": " + esc(full(s.r)) : ""}</span></button></li>`).join("") : "";
  $("#panel-body").innerHTML = `${x.top}
    <div class="map-actions"><a class="centre-btn" href="../#/osoba/${encodeURIComponent(id)}">Pokaż w drzewie</a><button type="button" class="ghost-btn" id="p-close">Wróć do roku</button></div>
    ${tr ? `<h3>Miejsca w aktach</h3><ol class="stops">${stops}</ol>` : `<p class="soft">Akty nie podają dla tej osoby miejsca z datą, więc nie ma jej na mapie.</p>`}
    ${x.body}${x.fam}`;
  $("#panel-body").scrollTop = 0;
  $("#p-close").addEventListener("click", () => { location.hash = "#/"; });
  document.querySelectorAll("#panel-body .stop").forEach(b => b.addEventListener("click", () => {
    const s = tr.st[+b.dataset.i];
    if (playing) setPlaying(false);
    t = s.y + 0.01; frame();
    map.panInside(PLC[s.p], { padding: [60, 60] });
  }));
}
function select(id) {
  sel = id;
  lastPanelKey = "";
  const tr = TR[id];
  if (tr) {
    if (!stateAt(id, t)) { if (playing) setPlaying(false); t = tr.st[0].y + 0.01; }
    const s = stateAt(id, t);
    frame();
    if (s) map.panInside(PLC[s.p], { padding: [80, 80] });
  } else frame();
  personPanel(id);
  openSheet(true);
}
function openSheet(open) {
  const b = $("#p-toggle");
  if (getComputedStyle(b).display === "none") return;
  $("#panel").classList.toggle("open", open);
  b.setAttribute("aria-expanded", String(open));
  b.querySelector("span").textContent = open ? "Zwiń" : "Szczegóły";
}

// ---------- router: #/osoba/id, #/rok/1893, #/dokument/k
let viewerReturn = "#/";
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const vr = $("#viewer-root");
  if (parts[0] === "dokument") {
    const v = viewer(parts[1], viewerReturn);
    if (v) { vr.innerHTML = v.html; vr.hidden = false; document.title = v.title + " · " + SITE; v.after(); return; }
  }
  vr.innerHTML = ""; vr.hidden = true;
  viewerReturn = location.hash || "#/";
  if (parts[0] === "osoba" && P[parts[1]]) { document.title = full(parts[1]) + " · Mapa · " + SITE; select(parts[1]); return; }
  sel = null; lastPanelKey = "";
  document.title = "Mapa · " + SITE;
  if (parts[0] === "rok" && +parts[1] >= Y0 && +parts[1] <= Y1) t = +parts[1] + 0.5;
  frame();
}

// ---------- start
map.on("zoomstart", () => { ov.style.visibility = "hidden"; });
map.on("zoomend", () => { ov.style.visibility = ""; frame(); });
map.on("move resize", () => { if (!playing) frame(); });
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { map.invalidateSize(); drawHist(); frame(); }, 150); });
$("#trails").addEventListener("change", e => { showTrails = e.target.checked; frame(); });
$("#p-toggle").addEventListener("click", () => openSheet(!$("#panel").classList.contains("open")));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#viewer-root").hidden) location.hash = viewerReturn;
  else if ($("#panel").classList.contains("open")) { openSheet(false); $("#p-toggle").focus(); }
});
bindSearch(go);
drawHist();
setPlaying(false);
addEventListener("hashchange", route);
route();
</script>
