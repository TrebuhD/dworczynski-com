 "media": "scans/nk/drzycimski/czersk-usc-1921-zg-112-antonina-gadzikowska-sumionka.jpg", "conf": "likely", "thumb": "img/thumb/1921-death-d1921g.jpg", "w": 1349, "h": 2200, "cat": "zgony"}}, "graves": [{"plot": "Cmentarz przykościelny, ul. Ogrodowa", "people": [["Kazimierz Dworczyński", "1910-1987", "kazimierz-dworczynski-1910"], ["Władysława Dworczyńska", "1919-1994", "wladyslawa-klaczyk-1919"], ["Franciszka Szylderowicz", "1893-1977", "franciszka-zydorczak-1893"], ["Tadeusz Szylderowicz", "1901-1983", "tadeusz-szylderowicz-1901"]], "note": "Rok urodzenia Kazimierza zgadza się z aktem z 1910 roku. Franciszka była matką Władysławy, a Tadeusz (ur. w Śremie w 1901) jej ojczymem (babcia Elżbieta).", "url": "https://billiongraves.com/grave/Kazimierz-Dworczy%C5%84ski/29912233"}, {"plot": "Cmentarz parafialny", "people": [["Kazimierz Kokociński", "1916-2011", "kazimierz-kokocinski-1916"], ["Anna Kokocińska", "1919-2007", "anna-cenker-1919"], ["Roman Szafrański", "1946-2015", "roman-szafranski-1946"]], "note": "Roman to zięć Kazimierza i Anny; jego żona Danuta, ich córka, żyje. Kazimierz urodził się w 1916 roku, więc jego akt urodzenia jest już jawny.", "url": "https://billiongraves.com/grave/Kazimierz-Kokocinski/25123105"}, {"plot": "Cmentarz komunalny", "people": [["Antoni Rychlewicz", "1 XII 1914 - 5 V 1987", "antoni-rychlewicz-1914"], ["Maria Rychlewicz", "1921-2012", "maria-porebska-1921"], ["Zbigniew Kubiak", "1947-2001", "zbigniew-kubiak-1947"], ["Karolina Porębska", "", "karolina-porebska"]], "note": "Ich córka Krystyna wyszła za Kubiaka. Karolina Porębska to niezamężna siostra Marii (według rodziny).", "url": "https://billiongraves.com/grave/Antoni-Rychlewicz/17260530"}, {"plot": "Cmentarz komunalny", "people": [["Stefan Kaźmierczak", "1911-2003", "stefan-kazimierczak-1911"], ["Wanda Kaźmierczak", "1920-1987", "wanda-adamska-1920"]], "note": "Zgadza się z drzewem. Akt chrztu Stefana z 1911 roku to akt z Dobrzeca powyżej.", "url": "https://billiongraves.com/grave/Stefan-Ka%C5%BAmierczak/18836430"}, {"plot": "Cmentarz Miejski (parafia katedralna św. Mikołaja), kw. 17, rz. 11, nr 15", "people": [["Józef Kazimierczak", "zm. 1 III 1950", "jozef-kazimierczak-1863"], ["Antonina Kazimierczak", "zm. 30 XII 1953", "antonina-dabkowska-1871"], ["Jadwiga Kazimierczak", "zm. 2 I 2007", "jadwiga-kazimierczak-1915"]], "note": "Data śmierci Józefa zgadza się z dopiskami na jego akcie chrztu i ślubu. Daty Antoniny i Jadwigi z księgi cmentarnej.", "url": "https://grobonet.com/p/kaliszkatedra/6252/jozef-kazimierczak-kalisz-katedra"}, {"plot": "Cmentarz parafialny św. Marcina, M/4/13", "people": [["Piotr Hojka", "3 I 1880 - 14 XII 1939", "piotr-hojka-1880"], ["Maria Hojka z d. Ceglarek", "10 VI 1885 - 16 I 1963", "maria-ceglarek-1885"]], "note": "Napis: „Tu spoczywają w Bogu nasi kochani rodzice”. Data urodzenia Piotra zgadza się z aktem z 1880 roku.", "url": "https://kepno.grobonet.com/osoba/7919"}, {"plot": "Cmentarz komunalny, sektor 6, rząd 4, miejsce 22", "people": [["Anna Klunder", "19 X 1869 - 11 I 1967", "nn-malzahn-klunder"]], "note": "Jedyna Klunder na tym cmentarzu, bez nazwiska panieńskiego. Rok urodzenia zgadza się z chrztem Anny Malzahn w Raciążu.", "url": "https://cmentarzchelmno.pl/wyswietl.php?id_miejsce=4422"}, {"plot": "Cmentarz komunalny, sektor 10-E, rząd 3, kwatera 6", "people": [["Domiana Gadzikowska", "10 XII 1879 - 10 I 1967", "domiana-knitter"]], "note": "Prawdopodobnie matka Antoniny Drzycimskiej.", "url": "https://www.ecmentarze.pl/cmentarz/pila-motylewska/grave/detail/4443944"}], "stories": [{"slug": "warnitz-lubeka", "title": "Z Mechlina do Lubeki", "lead": "Antoni Rychlewicz i Maria Porębska: roboty przymusowe w Meklemburgii i ślub tuż po wojnie.", "paras": [{"doc": "m1945r"}, "11 czerwca 1945 roku, miesiąc po końcu wojny, w urzędzie stanu cywilnego Lübeck I wzięli ślub cywilny <a href=\"#/osoba/antoni-rychlewicz-1914\">Antoni Rychlewicz<\/a> z Wielkopolski i <a href=\"#/osoba/maria-porebska-1921\">Maria Porębska<\/a> spod Nowego Sącza. W akcie zapisano: „Mann: Pole, Frau: Polin”. Mieszkali wtedy w Lubece przy ulicy Bei der Lohmühle; odpis aktu przechowuje Arolsen Archives.", "Według rodziny oboje trafili na roboty przymusowe do gospodarstwa w Warnitz w Meklemburgii, prawdopodobnie w dzielnicy Schwerinu, około 55 km od Lubeki. Maria najpewniej wyjechała przez urząd pracy w Nowym Sączu, który od 1940 roku wzywał na roboty całe roczniki. W maju 1945 roku Schwerin zajęli Amerykanie, a potem Brytyjczycy; wielu polskich robotników przewieziono wtedy do obozów w Lubece.", {"doc": "m1904"}, "Antoni urodził się w 1914 roku w Wieszczyczynie pod Dolskiem. Praca w Niemczech nie była w tej rodzinie nowa: jego ojciec, <a href=\"#/osoba/maciej-rychlewicz-1880\">Maciej<\/a>, w chwili ślubu w 1904 roku był górnikiem w Osterfeld w Zagłębiu Ruhry. Matka, <a href=\"#/osoba/anna-wlodarczak-1886\">Anna z Włodarczaków<\/a>, pochodziła z Mechlina pod Śremem; jej ojciec, <a href=\"#/osoba/roch-wlodarczak-1849\">Roch<\/a>, zmarł tam w wieku 39 lat, gdy nie miała jeszcze dwóch lat.", "Na pruskiej liście strat z 3 sierpnia 1916 roku jest „Rychlewicz, Mathias, Tulce, Schroda, gefallen”. To prawdopodobnie ojciec Antoniego. Anna została z czworgiem dzieci w wieku od roku do ośmiu lat. Zmarła w Mechlinie w 1958 roku.", "Maria urodziła się w 1921 roku w Podegrodziu, w dawnej Galicji. Jej matka, <a href=\"#/osoba/ludwika-nowinska-1896\">Ludwika z Nowińskich<\/a>, przy ślubie w 1919 roku była niepełnoletnia; zgodę wydał sąd opiekuńczy w Starym Sączu. Ojciec, <a href=\"#/osoba/stanislaw-porebski-1891\">Stanisław Porębski<\/a>, był zagrodnikiem z sąsiedniej Gostwicy.", "Antoni zmarł w 1987 roku, Maria w 2012 roku. Leżą razem na cmentarzu komunalnym w Śremie, w jednym grobie z niezamężną siostrą Marii, <a href=\"#/osoba/karolina-porebska\">Karoliną<\/a>."], "people": ["antoni-rychlewicz-1914", "maria-porebska-1921", "maciej-rychlewicz-1880", "anna-wlodarczak-1886", "roch-wlodarczak-1849", "ludwika-nowinska-1896", "stanislaw-porebski-1891", "karolina-porebska"], "docs": ["m1945r", "m1904"], "years": "1849-2012"}, {"slug": "kepa-mala", "title": "Brat posła z Kępy Małej", "lead": "Chałupnicy spod Zaniemyśla, dwóch powstańców i komunistyczny poseł w rodzinie Władysławy Dworczyńskiej.", "paras": ["<a href=\"#/osoba/jan-izydorczyk-1900\">Jan Izydorczak<\/a>, urodzony w 1900 roku w Kępie Małej koło Zaniemyśla, to najpewniej Jan Izydorczyk znany z historii PRL. W 1919 roku był powstańcem wielkopolskim w Kompanii Kórnickiej, w tym samym roku wstąpił do Komunistycznej Partii Polski i przed wojną spędził około dziewięciu lat w więzieniach. W czasie wojny był w Auschwitz i Buchenwaldzie. Po wojnie kierował PPR w Poznaniu, przez 22 lata był posłem na Sejm i ambasadorem PRL w NRD i w Rumunii. Zmarł w 1974 roku i leży na Wojskowych Powązkach.", "Akt urodzenia Jana podaje tych samych rodziców co akt jego starszej siostry, <a href=\"#/osoba/franciszka-zydorczak-1893\">Franciszki<\/a>, urodzonej w 1893 roku: chałupnika <a href=\"#/osoba/franciszek-zydorczak\">Franciszka Zydorczaka<\/a> i <a href=\"#/osoba/katarzyna-baranska\">Katarzynę z Barańskich<\/a>. Od 1900 roku urzędnik zapisywał nazwisko rodziny jako Izydorczak.", {"doc": "m1913k"}, "W 1913 roku dwudziestoletnia Franciszka wyszła za wdowca <a href=\"#/osoba/teodor-klaczyk-1876\">Teodora Klaczyka<\/a>, robotnika z Mechlina. Teodora nie ma na żadnej liście strat z lat 1914-1920; kiedy i na co zmarł, nie wiemy. Ich córką była prawdopodobnie <a href=\"#/osoba/wladyslawa-klaczyk-1919\">Władysława<\/a>, późniejsza żona Kazimierza Dworczyńskiego.", {"doc": "q1901s"}, "Drugim mężem Franciszki był <a href=\"#/osoba/tadeusz-szylderowicz-1901\">Tadeusz Szylderowicz<\/a>, syn kowala z Mechlina. W styczniu 1919 roku, mając 17 lat, walczył w 2 Kompanii Śremskiej pod Rawiczem i Kępnem, a w 1968 roku dostał Wielkopolski Krzyż Powstańczy. Był rolnikiem w Mechlinie. Franciszka zmarła tam w 1977 roku, Tadeusz w Śremie w 1983 roku."], "people": ["jan-izydorczyk-1900", "franciszka-zydorczak-1893", "franciszek-zydorczak", "katarzyna-baranska", "teodor-klaczyk-1876", "wladyslawa-klaczyk-1919", "tadeusz-szylderowicz-1901"], "docs": ["m1913k", "q1901s"], "years": "1865-1994"}, {"slug": "kepno", "title": "Kępno: Wanda Sabina i rodzina Hojków", "lead": "Jak rodzinne „Sojka albo Chojka” okazało się Hojką z Olszowej.", "paras": [{"doc": "b1896a"}, "<a href=\"#/osoba/julian-adamski-1896\">Julian Adamski<\/a> urodził się w 1896 roku w Kępnie, wtedy w zaborze pruskim, w rodzinie robotnika <a href=\"#/osoba/jozef-adamski\">Józefa<\/a> i <a href=\"#/osoba/maria-grabska\">Marii z Grabskich<\/a>. Był cieślą. Jak inni chłopcy z jego rocznika trafił do armii niemieckiej: pruska lista strat z grudnia 1916 roku wymienia Juliusa Adamskiego z Kempen, ciężko rannego w kompanii miotaczy min, której dywizja walczyła nad Sommą. To najpewniej on.", "<a href=\"#/osoba/helena-hojka-1899\">Helena Hojka<\/a> urodziła się w 1899 roku w Olszowej pod Kępnem, jako córka gospodarza <a href=\"#/osoba/piotr-hojka\">Piotra Hojki<\/a>. W rodzinie zapamiętano jej nazwisko jako „Sojka albo Chojka”; akty mówią jasno: Hojka. Julian i Helena wzięli ślub w Kępnie w 1919 roku, a rok później urodziła się ich córka <a href=\"#/osoba/wanda-adamska-1920\">Wanda Sabina<\/a>.", {"doc": "b1920a"}, "Na akcie urodzenia Wandy jest dopisek z 9 stycznia 1941 roku: imię ojca poprawiono z „Jan” na „Julian”. Cztery dni wcześniej Wanda wzięła ślub w Warszawie ze <a href=\"#/osoba/stefan-kazimierczak-1911\">Stefanem Kazimierczakiem<\/a> (według rodziny). Jesienią 1939 roku Niemcy wcielili Kępno do Rzeszy i wysiedlili około 1500 Polaków do Generalnego Gubernatorstwa; czy Wanda trafiła do Warszawy z wysiedlenia, nie wiemy. Brat Heleny, <a href=\"#/osoba/piotr-hojka-1880\">Piotr Hojka<\/a>, zmarł w Kępnie 14 grudnia 1939 roku, tydzień po grudniowym wysiedleniu; na co, nie wiadomo.", "Po wojnie rodzina mieszkała w Kępnie, a około 1949 roku przeniosła się do Śremu. Tam zmarli Julian (1969), Helena (1971) i Wanda (1987)."], "people": ["julian-adamski-1896", "jozef-adamski", "maria-grabska", "helena-hojka-1899", "piotr-hojka", "wanda-adamska-1920", "stefan-kazimierczak-1911", "piotr-hojka-1880"], "docs": ["b1896a", "b1920a"], "years": "1869-2003"}, {"slug": "dworczynscy", "title": "Dworczyńscy wokół Śremu", "lead": "Robotnicy z majątków pod Dolskiem i ślub wzięty w 1941 roku, zanim Niemcy to utrudnili.", "paras": [{"doc": "b1910"}, "Na marginesie aktu urodzenia <a href=\"#/osoba/kazimierz-dworczynski-1910\">Kazimierza Dworczyńskiego<\/a> z 1910 roku jest późniejsza niemiecka pieczątka: ślub zawarty 19 kwietnia 1941 roku w Śremie. Kazimierz i <a href=\"#/osoba/wladyslawa-klaczyk-1919\">Władysława z Klaczyków<\/a> zdążyli, zanim Niemcy podnieśli Polakom wiek wymagany do małżeństwa; w 1942 roku polskich ślubów w rejencji poznańskiej było o ponad połowę mniej. 25 lutego 1942 roku urodził im się syn <a href=\"#/osoba/wojciech-dworczynski-1942\">Wojciech<\/a>.", {"doc": "m1901"}, "Kazimierz był najmłodszym znanym dzieckiem <a href=\"#/osoba/franciszek-dworczynski-1878\">Franciszka Dworczyńskiego<\/a> i <a href=\"#/osoba/katarzyna-walkowiak-1882\">Katarzyny z Walkowiaków<\/a>, którzy wzięli ślub w Międzychodzie pod Dolskiem w 1901 roku. Franciszek był robotnikiem, synem <a href=\"#/osoba/jan-dworczynski-1844\">Jana<\/a>, chałupnika z Drzonka, i <a href=\"#/osoba/marianna-lagoda-1843\">Marianny z Łagodów<\/a>; ojciec Katarzyny, <a href=\"#/osoba/andrzej-walkowiak-1853\">Andrzej<\/a>, był owczarzem. Rodzina przenosiła się między majątkami: Drzonek był folwarkiem państwowej domeny Grzymisław, Międzychód majątkiem Sczanieckich, a później Bukowieckich.", "Na pruskiej liście strat z 1915 roku jest Franz Dworczinski z Masłowa pod Dolskiem, lekko ranny; może to Franciszek, ale pewności nie ma. Kiedy zmarli on i Katarzyna, nie wiemy: w indeksach nie ma ich zgonów.", "Kazimierz zmarł w 1987 roku, Władysława w 1994 roku. Leżą na cmentarzu przy ul. Ogrodowej w Śremie, w jednym grobie z matką Władysławy, <a href=\"#/osoba/franciszka-zydorczak-1893\">Franciszką<\/a>, i jej drugim mężem, <a href=\"#/osoba/tadeusz-szylderowicz-1901\">Tadeuszem Szylderowiczem<\/a>. O ich rodzinie opowiada historia <a href=\"#/historie/kepa-mala\">Brat posła z Kępy Małej<\/a>."], "people": ["kazimierz-dworczynski-1910", "wladyslawa-klaczyk-1919", "wojciech-dworczynski-1942", "franciszek-dworczynski-1878", "katarzyna-walkowiak-1882", "jan-dworczynski-1844", "marianna-lagoda-1843", "andrzej-walkowiak-1853", "franciszka-zydorczak-1893", "tadeusz-szylderowicz-1901"], "docs": ["b1910", "m1901"], "years": "1837-2009"}, {"slug": "kazimierczakowie", "title": "Kazimierczakowie spod Kalisza", "lead": "Spod Kalisza do Warszawy, Niemiec i Śremu.", "paras": [{"doc": "m1893"}, "Kazimierczakowie i Dąbkowscy byli wyrobnikami i komornikami spod Kalisza. <a href=\"#/osoba/jozef-kazimierczak-1863\">Józef Kazimierczak<\/a>, syn wyrobnika <a href=\"#/osoba/stanislaw-kazimierczak-1819\">Stanisława<\/a> z Czartek, owdowiał w wieku 28 lat. 22 stycznia 1893 roku w Tykadłowie poślubił <a href=\"#/osoba/antonina-dabkowska-1871\">Antoninę Dąbkowską<\/a>, służącą z Russowa. W drzewie rodzinnym zapisano ją jako „Dąbską”; akty mówią zgodnie: Dąbkowska. Tego samego dnia w tym samym kościele ślub wzięła jej siostra <a href=\"#/osoba/marianna-dabkowska-1869\">Marianna<\/a>.", "Młodsze dzieci Józefa i Antoniny urodziły się w parafii Dobrzec pod Kaliszem, wśród nich <a href=\"#/osoba/stefan-kazimierczak-1911\">Stefan<\/a> w 1911 roku; gdzie urodziły się starsze, nie wiemy. Rodzina przeżyła zburzenie Kalisza przez Niemców w sierpniu 1914 roku. Józef i Antonina zmarli w Kaliszu w 1950 i 1953 roku.", {"doc": "a1944p"}, "Część rodzeństwa Stefana przeniosła się do Warszawy, a wojna rozrzuciła ją dalej. <a href=\"#/osoba/piotr-kazimierczak-1902\">Piotr<\/a>, inżynier, po Powstaniu Warszawskim trafił z żoną i córką do Bernburga w Niemczech. <a href=\"#/osoba/kazimierz-kazimierczak-1913\">Kazimierz<\/a> od sierpnia 1944 do maja 1945 roku był robotnikiem przymusowym w fabryce I.G. Farben w Rottweil.", "Stefan jesienią 1940 roku był handlowcem w Radzyminie pod Warszawą. Po ślubie z <a href=\"#/osoba/wanda-adamska-1920\">Wandą Adamską<\/a> w 1941 roku mieszkał w Kępnie, a od około 1949 roku w Śremie, gdzie w latach 60. i 70. był prawdopodobnie prezesem powiatowego związku spółdzielni rolniczych. Zmarł w Śremie w 2003 roku, mając 91 lat."], "people": ["jozef-kazimierczak-1863", "stanislaw-kazimierczak-1819", "antonina-dabkowska-1871", "marianna-dabkowska-1869", "stefan-kazimierczak-1911", "piotr-kazimierczak-1902", "kazimierz-kazimierczak-1913", "wanda-adamska-1920"], "docs": ["m1893", "a1944p"], "years": "1819-2003"}, {"slug": "tykadlow-pustelnik", "title": "Z Pustelnika pod Śrem", "lead": "Komornicy i słudzy dworscy spod Kalisza, gospodarze pod Sieradzem i pytanie, jak Kazimierz Kokociński trafił pod Śrem.", "paras": ["<a href=\"#/osoba/kazimierz-kokocinski-1916\">Kazimierz Kokociński<\/a> urodził się 28 grudnia 1916 roku w Pustelniku pod Sieradzem, a zmarł w Śremie w 2011 roku. Jak trafił z jednego miejsca do drugiego? Akty dają tylko trop.", {"doc": "m1908"}, "Jego rodzice pochodzili z Tykadłowa pod Kaliszem, wsi w Królestwie Polskim, gdzie od 1868 roku akty spisywano po rosyjsku. Ojciec, <a href=\"#/osoba/walenty-kokocinski-1881\">Walenty<\/a>, był synem <a href=\"#/osoba/kacper-kokocinski-1852\">Kacpra<\/a>, furmana i sługi dworskiego. Matka, <a href=\"#/osoba/jozefa-zesko-1887\">Józefa Żeśko<\/a>, pochodziła z rodziny parobków i komorników; nazwisko pisano Rześko, Żeśko, a później Żyśko. Pobrali się w Tykadłowie w 1908 roku.", {"doc": "b1917"}, "Rodzina osiadła potem w Pustelniku w parafii Brzeźnio, dawnym folwarku, na którym dawni komornicy i słudzy dworscy zostali gospodarzami. Na akcie chrztu Kazimierza świadkiem był dziadek, <a href=\"#/osoba/antoni-zesko-1857\">Antoni Żyśko<\/a>, „gospodarz z Pustelnika, lat 56”. Żyśkowie, Stencelowie i Kokocińscy mieszkali tam obok siebie.", "Trop prowadzi przez siostry matki. W latach 30. <a href=\"#/osoba/dorota-zesko-1886\">Dorota Stencel<\/a> i Marianna Wawrzyniak mieszkały już w Tworzykowie koło Jaszkowa pod Śremem, a w tej samej wsi w 1935 roku mieszkali Cenkerowie. Prawdopodobnie tą drogą Kazimierz trafił pod Śrem i poznał <a href=\"#/osoba/anna-cenker-1919\">Annę Cenker<\/a>. Kiedy dokładnie, nie wiemy: to pytanie do rodziny."], "people": ["kazimierz-kokocinski-1916", "walenty-kokocinski-1881", "kacper-kokocinski-1852", "jozefa-zesko-1887", "antoni-zesko-1857", "dorota-zesko-1886", "anna-cenker-1919"], "docs": ["m1908", "b1917"], "years": "1852-2011"}, {"slug": "wielka-wojna", "title": "Wielka wojna 1914-1918", "lead": "Pradziadkowie w dwóch armiach: co mówią listy strat.", "paras": ["W czasie I wojny światowej mężczyźni z drzewa służyli w armii pruskiej albo austro-węgierskiej, zależnie od zaboru. Pruskie i austriackie listy strat są dziś przeszukiwalne i kilka nazwisk z drzewa w nich jest.", {"doc": "v1916r"}, "Najciężej trafiło Rychlewiczów. <a href=\"#/osoba/maciej-rychlewicz-1880\">Maciej<\/a> prawdopodobnie poległ w 1916 roku na froncie wschodnim jako żołnierz 12. rezerwowego pułku piechoty. Pół roku wcześniej pod Verdun zmarł z ran prawdopodobnie jego młodszy brat <a href=\"#/osoba/jozef-rychlewicz-1883\">Józef<\/a>, muszkieter 20 pułku piechoty.", "<a href=\"#/osoba/julian-adamski-1896\">Julian Adamski<\/a> z Kępna został w 1916 roku ciężko ranny, najpewniej nad Sommą, i przeżył. Franz Dworczinski, lekko ranny w 1915 roku, mógł być <a href=\"#/osoba/franciszek-dworczynski-1878\">Franciszkiem Dworczyńskim<\/a>; pewności nie ma. Stanisław Dworczyński z tego samego Masłowa poległ przed majem 1918 roku; to zapewne krewny. Po stronie austriackiej brat Ludwiki Porębskiej, <a href=\"#/osoba/ignacy-nowinski-1889\">Ignacy Nowiński<\/a>, był prawdopodobnie w niewoli rosyjskiej i wrócił w wymianie jeńców tydzień przed swoim ślubem w styczniu 1919 roku.", "W 1919 roku w powstaniu wielkopolskim walczyli siedemnastoletni <a href=\"#/osoba/tadeusz-szylderowicz-1901\">Tadeusz Szylderowicz<\/a> i najpewniej <a href=\"#/osoba/jan-izydorczyk-1900\">Jan Izydorczak<\/a>."], "people": ["maciej-rychlewicz-1880", "jozef-rychlewicz-1883", "julian-adamski-1896", "franciszek-dworczynski-1878", "ignacy-nowinski-1889", "tadeusz-szylderowicz-1901", "jan-izydorczyk-1900"], "docs": ["v1916r"], "years": "1878-1983"}, {"slug": "ciekawostki", "title": "Trzy zabory i inne ciekawostki", "lead": "Ciekawostki i mniej wesołe fakty z drzewa: co wyszło z aktów.", "paras": ["Rodziny pradziadków Huberta pochodziły z trzech zaborów. Śrem, Dolsk i Kępno były w zaborze pruskim, a akty pisano tam po niemiecku. Kalisz, Tykadłów i Brzeźnio leżały w Królestwie Polskim, gdzie akty spisywano cyrylicą. Podegrodzie pod Nowym Sączem należało do Galicji, a księgi parafialne prowadzono po łacinie. Całe ośmioro pradziadków spoczywa w Śremie.", "Rodziny ze strony taty i mamy zetknęły się na długo przed spotkaniem rodziców Huberta. W Tykadłowie w 1893 roku wzięła ślub <a href=\"#/osoba/antonina-dabkowska-1871\">Antonina Dąbkowska<\/a> (strona taty), a w tej samej parafii, w tych samych latach, mieszkali <a href=\"#/osoba/kacper-kokocinski-1852\">Kokocińscy<\/a> i <a href=\"#/osoba/antoni-zesko-1857\">Żeśkowie<\/a> (strona mamy). W Mechlinie pod Śremem przez dziesięciolecia żyły dwie praprababcie: <a href=\"#/osoba/franciszka-zydorczak-1893\">Franciszka z Zydorczaków<\/a> (strona taty, pokrewieństwo prawdopodobne) i <a href=\"#/osoba/anna-wlodarczak-1886\">Anna z Włodarczaków<\/a> (strona mamy). Wspólnego przodka obu stron akty jeszcze nie pokazują.", {"doc": "b1911"}, "Urzędnicy i pamięć rodzinna myliły tropy. W 1911 roku w Dobrzecu zapisano <a href=\"#/osoba/stefan-kazimierczak-1911\">Stefana Kazimierczaka<\/a> jako „dziecię płci żeńskiej”; imię i dalszy tekst nie pozostawiają wątpliwości. „Dąbska” to w aktach Dąbkowska, „Sojka albo Chojka” to Hojka, a Szylderowicz okazał się nazwiskiem ojczyma. <a href=\"#/osoba/mateusz-wojtkowiak-1813\">Mateusz Wojtkowiak<\/a> urodził się jako Rychlewicz, a jego córka <a href=\"#/osoba/wiktoria-wojtkowiak-1853\">Wiktoria<\/a> wyszła potem za <a href=\"#/osoba/walenty-rychlewicz-1848\">Walentego Rychlewicza<\/a>. Bliźniacy <a href=\"#/osoba/stanislaw-porebski-1891\">Stanisław<\/a> i <a href=\"#/osoba/pawel-porebski-1891\">Paweł Porębscy<\/a> wzięli ślub dzień po dniu, w listopadzie 1919 roku (Paweł według indeksu).", "Najstarszy znany przodek, <a href=\"#/osoba/michal-szlakowski\">Michał Szlakowski<\/a>, ożenił się ponownie w 1812 roku jako 53-letni wdowiec, więc urodził się około 1759 roku (według indeksu). Pokolenie pradziadków żyło długo: <a href=\"#/osoba/kazimierz-kokocinski-1916\">Kazimierz Kokociński<\/a> dożył 94 lat, Stefan Kazimierczak 91, <a href=\"#/osoba/maria-porebska-1921\">Maria Porębska<\/a> 90.", "Wcześniej bywało ciężej. <a href=\"#/osoba/roch-wlodarczak-1849\">Roch i Marianna Włodarczakowie<\/a> stracili między 1878 a 1882 rokiem czworo dzieci, w tym dwoje martwo urodzonych; Roch zmarł w wieku 39 lat. <a href=\"#/osoba/antoni-nowinski\">Antoni Nowiński<\/a>, kościelny w Podegrodziu, zmarł na raka w wieku 43 lat, gdy jego córka Ludwika miała 5 miesięcy. Wcześniej stracił dwoje dzieci, <a href=\"#/osoba/michal-nowinski-1892\">Michała<\/a> i <a href=\"#/osoba/zofia-nowinska-1894\">Zofię<\/a>, a w 1903 roku zmarł też szesnastoletni <a href=\"#/osoba/jan-nowinski-1887\">Jan<\/a>. Szlachty w drzewie nie ma: są komornicy, parobkowie, owczarz, furman, stróż i słudzy dworscy."], "people": ["antonina-dabkowska-1871", "kacper-kokocinski-1852", "antoni-zesko-1857", "franciszka-zydorczak-1893", "anna-wlodarczak-1886", "stefan-kazimierczak-1911", "mateusz-wojtkowiak-1813", "wiktoria-wojtkowiak-1853", "walenty-rychlewicz-1848", "stanislaw-porebski-1891", "pawel-porebski-1891", "michal-szlakowski", "kazimierz-kokocinski-1916", "maria-porebska-1921", "roch-wlodarczak-1849", "antoni-nowinski", "michal-nowinski-1892", "zofia-nowinska-1894", "jan-nowinski-1887"], "docs": ["b1911"], "years": "1813-2012"}], "welcome": {"lead": "Przodkowie i krewni Leona Dworczyńskiego: rodziny jego taty Huberta i mamy Nicole z Klundrów, odczytani z ksiąg parafialnych, akt stanu cywilnego, list strat i gazet.", "oldest": "Najstarszy znany przodek, Michał Szlakowski, urodził się około 1759 roku.", "howto": "Dotknij osoby, żeby o niej przeczytać, a dwa razy, żeby ustawić ją w środku. W widoku Drzewo przyciski z plusem pokazują rodziców (nad osobą), rodzeństwo (obok) i dzieci (pod spodem); przycisk z minusem je chowa.", "colours": [["confirmed", "zielony: potwierdzone w akcie"], ["likely", "brązowy: prawdopodobne, bez pewnego dowodu"], ["possible", "brązowy z przerywaną ramką: możliwe, słaby lub pojedynczy ślad"], ["family", "szary: według rodziny, jeszcze bez dokumentu"], ["living", "fioletowy: osoby żyjące, tylko imię i rok urodzenia"]]}, "cats": [["urodzenia", "Urodzenia"], ["sluby", "Śluby"], ["zgony", "Zgony"], ["groby", "Groby"], ["wojny", "Wojny"], ["prasa", "Prasa i odznaczenia"], ["ksiazki", "Książki i spisy"], ["inne", "Inne"]]}; window.__GEO__ = {"places": {"Białystok": [53.1322, 23.1686], "Borek": [51.9164, 17.2422], "Borków": [51.8286, 18.1256], "Brzeźnio": [51.4947, 18.6228], "Bydgoszcz": [53.1235, 18.0084], "Chełmno": [53.3494, 18.4235], "Chocz": [51.9752, 17.8707], "Chojnice": [53.6967, 17.5578], "Czartki": [51.835, 18.1542], "Czersk": [53.7967, 17.9778], "Dobrzec": [51.7536, 18.0356], "Dolsk": [51.9867, 17.0661], "Drzonek": [52.0314, 17.0564], "Drzycim": [53.4889, 18.3239], "Działdowo": [53.2367, 20.169], "Długa Wieś": [51.92, 18.088], "Gawrony": [52.0397, 17.0333], "Gdańsk": [54.352, 18.6466], "Gelsenkirchen": [51.5177, 7.0857], "Godziątków": [51.9168, 18.0497], "Gorzów Wielkopolski": [52.7308, 15.2383], "Gostwica": [49.5955, 20.5916], "Głoginin": [51.8711, 17.3053], "Jaszkowo": [52.1419, 16.9744], "Jawory": [51.9442, 17.1817], "Kalisz": [51.7608, 18.0869], "Karsi function bindSearch(onPick, onType = () => {}) {  // onType gets every match while typing, null when the query clears
  const q = $("#q"), res = $("#q-res");
  const all = Object.keys(P).map(id => [id, fold([full(id), P[id].m, P[id].by].filter(Boolean).join(" "))]);
  let hits = [], act = -1;
  const close = () => { res.hidden = true; q.setAttribute("aria-expanded", "false"); q.removeAttribute("aria-activedescendant"); act = -1; };
  const paint = () => {
    res.innerHTML = hits.length ? hits.map((id, i) => `<li role="option" id="qo-${i}" data-id="${esc(id)}" aria-selected="${i === act}"><b>${esc(full(id))}</b> <span>${esc(yrs(id))}${P[id].m ? ", " + esc(alt(id)) : ""}</span></li>`).join("") : `<li class="none" role="option" aria-disabled="true">Nikogo nie znaleziono</li>`;
    res.hidden = false; q.setAttribute("aria-expanded", "true");

  };

    if (!t.length) { close(); onType(null); return; }
    const found = all.filter(([, s]) => t.every(w => s.includes(w))).map(([id]) => id);
    onType(new Set(found));
    hits = found.sort(byBirth).slice(0, 12);
    act = hits.length ? 0 : -1; paint();
  });
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { if (!hits.length) return; e.preventDefault(); act = (act + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % hits.length; paint(); }

}

function stateAt(id, t) {

  if (t < st[0].y) return null;
  const end = tr.d != null ? tr.d + GHOST : tr.db != null ? tr.db : lastY + KEEP + FADE;
  if (t > end) return null;

  const stops = tr ? tr.st.map((s, i) => `<li><button type="button" class="stop" data-i="${i}"><span class="y">${Math.floor(s.y)}</span><span class="pl">${esc(short(s.p))}</span><span class="k">${esc(KINDN[s.k])}${s.r && P[s.r] ? ": " + esc(full(s.r)) : ""}</span></button></li>`).join("") : "";
  $("#panel-body").innerHTML = `${x.top}
    <div class="map-actions"><a class="centre-btn" href="../#/osoba/${encodeURIComponent(id)}">Pokaż w drzewie</a><button type="button" class="ghost-btn" id="p-close">Wróć do roku</button></div>
    ${tr ? `<h3>Miejsca w aktach</h3><ol class="stops">${stops}</ol>` : `<p class="soft">Akty nie podają dla tej osoby miejsca z datą, więc nie ma jej na mapie.</p>`}
    ${x.body}${x.fam}`;
  $("#panel-body").scrollTop = 0;
  $("#p-close").addEventListener("click", () => { location.hash = "#/"; });
  document.querySelectorAll("#panel-body .stop").forEach(b => b.addEventListener("click", () => {
    const s = tr.st[+b.dataset.i];
    if (playing) setPlaying(false);
    t = s.y + 0.01; frame();
    map.panInside(PLC[s.p], { padding: [60, 60] });
  }));
}
function select(id) {
  sel = id;
  lastPanelKey = "";
  const tr = TR[id];
  if (tr) {
    if (!stateAt(id, t)) { if (playing) setPlaying(false); t = tr.st[0].y + 0.01; }
    const s = stateAt(id, t);
    frame();
    if (s) map.panInside(PLC[s.p], { padding: [80, 80] });
  } else frame();
  personPanel(id);
  openSheet(true);
}
function openSheet(open) {
  const b = $("#p-toggle");
  if (getComputedStyle(b).display === "none") return;
  $("#panel").classList.toggle("open", open);
  b.setAttribute("aria-expanded", String(open));
  b.querySelector("span").textContent = open ? "Zwiń" : "Szczegóły";
}

// ---------- router: #/osoba/id, #/rok/1893, #/dokument/k
let viewerReturn = "#/";
function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(dec);
  const vr = $("#viewer-root");
  if (parts[0] === "dokument") {
    const v = viewer(parts[1], viewerReturn);
    if (v) { vr.innerHTML = v.html; vr.hidden = false; document.title = v.title + " · " + SITE; v.after(); return; }
  }
  vr.innerHTML = ""; vr.hidden = true;
  viewerReturn = location.hash || "#/";
  if (parts[0] === "osoba" && has(P, parts[1])) { document.title = full(parts[1]) + " · Mapa · " + SITE; select(parts[1]); return; }
  sel = null; lastPanelKey = "";
  document.title = "Mapa · " + SITE;
  if (parts[0] === "rok" && +parts[1] >= Y0 && +parts[1] <= Y1) t = +parts[1] + 0.5;
  frame();
}

// ---------- start
map.on("zoomstart", () => { ov.style.visibility = "hidden"; });
map.on("zoomend", () => { ov.style.visibility = ""; frame(); });
map.on("move resize", () => { if (!playing) frame(); });
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { map.invalidateSize(); drawHist(); frame(); }, 150); });
$("#trails").addEventListener("change", e => { showTrails = e.target.checked; frame(); });
$("#p-toggle").addEventListener("click", () => openSheet(!$("#panel").classList.contains("open")));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#viewer-root").hidden) location.hash = viewerReturn;
  else if ($("#panel").classList.contains("open")) { openSheet(false); $("#p-toggle").focus(); }
});
bindSearch(go);
drawHist();
setPlaying(false);
addEventListener("hashchange", route);
route();
</script>
</body>
