    <h1>Hubert Dworczyński</h1>
    <p class="tagline">Software engineer. Poznań, Poland.</p>
    <div class="rule"></div>
    <p class="domain">dworczynski.com</p>
  </div>
</div>

<script type="module">
const P = new URLSearchParams(location.search);
const STYLE = +(P.get('style') ?? 2);        // 0 wash 1 glow 2 lit 3 poster
const isDark = P.get('mode') !== 'light';
const T = +(P.get('t') ?? 40);               // frozen clock
const BOOST = +(P.get('boost') ?? 2.6);      // OG carries less text than the page, so more ink

document.documentElement.style.setProperty('--bg',    isDark ? '#14140f' : '#fbfaf8');
document.documentElement.style.setProperty('--fg',    isDark ? '#e8e5de' : '#1a1a1a');
document.documentElement.style.setProperty('--dim',   isDark ? '#86817a' : '#7a7670');
document.documentElement.style.setProperty('--rule',  isDark ? '#2c2b26' : '#e0ddd7');
document.documentElement.style.setProperty('--grain-o', isDark ? '0.11' : '0.26');

const canvas = document.getElementById('plate');
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const format = navigator.gpu.getPreferredCanvasFormat();
const ctx = canvas.getContext('webgpu');
ctx.configure({ device, format, alphaMode: 'premultiplied' });

const code = await (await fetch('./shader.wgsl')).text();
const mod = device.createShaderModule({ code });

const pipe = device.createRenderPipeline({
  layout: 'auto',
  vertex: { module: mod, entryPoint: 'vs' },
  fragment: {
    module: mod, entryPoint: 'fs',
    targets: [{ format, blend: {
      color: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' },
      alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' },
    } }],
  },
  primitive: { topology: 'triangle-list' },
});

const ubuf = device.createBuffer({ size: 96, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
const udata = new Float32Array(24);
const bind = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });

// Same constants as the page.
const SPEED = 0.055;
const CENTER = [4.2, 3.6, 4.6, 3.2];
const OPACITY   = [0.11, 0.10, 0.15, 0.10];
const OPACITY_L = [0.08, 0.07, 0.11, 0.07];
const THR       = [0.60, 0.52, 0.32, 0.50];
const NZ        = [0.10, 0.10, 0.06, 0.14];
const dpr = 2;

const t = T * SPEED;
const an = CENTER[0] + 2.2 * Math.sin(t * 0.41) + 0.6 * Math.sin(t * 0.97 + 1.3);
const am = CENTER[1] + 1.7 * Math.cos(t * 0.33) + 0.5 * Math.sin(t * 1.13 + 0.4);
const bn = CENTER[2] + 1.9 * Math.sin(t * 0.29 + 2.1) + 0.5 * Math.cos(t * 0.83);
const bm = CENTER[3] + 1.5 * Math.cos(t * 0.47 + 1.1) + 0.5 * Math.sin(t * 0.71);
const th = t * 0.53 + 0.7 * Math.sin(t * 0.19);
const lam1 = 1 + 0.35 * Math.sin(t * 0.61 + 0.9);
const lam2 = 1 + 0.35 * Math.cos(t * 0.53 + 2.4);
const mx = Math.cos(th), my = Math.sin(th);

udata[0] = canvas.width;  udata[1] = canvas.height;
udata[2] = an; udata[3] = am; udata[4] = bn; udata[5] = bm;
udata[6] = mx; udata[7] = my;
udata[8] = lam1; udata[9] = lam2;
udata[10] = (isDark ? OPACITY[STYLE] : OPACITY_L[STYLE]) * BOOST;
udata[11] = STYLE;
udata[12] = Math.PI * ((an + am + bn + bm) / 4) / canvas.height;
udata[13] = t * 0.7;
udata[14] = THR[STYLE];
udata[15] = NZ[STYLE];
udata[16] = 2.0 * dpr;
udata[17] = 0.55 * (Math.abs(mx) * (1 + lam1) + Math.abs(my) * (1 + lam2));
udata[20] = isDark ? 0.91 : 0.10;
udata[21] = isDark ? 0.90 : 0.10;
udata[22] = isDark ? 0.87 : 0.10;
udata[23] = 1;
device.queue.writeBuffer(ubuf, 0, udata);

const enc = device.createCommandEncoder();
const pass = enc.beginRenderPass({
  colorAttachments: [{ view: ctx.getCurrentTexture().createView(),
    clearValue: { r: 0, g: 0, b: 0, a: 0 }, loadOp: 'clear', storeOp: 'store' }],
});
pass.setPipeline(pipe);
pass.setBindGroup(0, bind);
pass.draw(3);
pass.end();
device.queue.submit([enc.finish()]);
await device.queue.onSubmittedWorkDone();
document.title = 'ready';
</script>
